<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AoH Regras V5.1a</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--night:#0b1114;--stone:#121b20;--steel:#19252b;--steel2:#22323a;--line:#33474f;--bronze:#7d5c33;--gold:#c9a45c;--gold2:#e7c98a;--parch:#e8dbbb;--ink:#2a2116;--text:#eee8da;--muted:#b3c0bd;--dim:#93a3a0;--ok:#9ec4a2;--warn:#e5bf72;--bad:#e59a86;--mark:#f4ecd8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05090b;color:var(--text);font:14px/1.45 'Source Sans 3',system-ui,sans-serif}
.frame{position:relative;width:1440px;height:900px;overflow:hidden;background:var(--night);margin:0 auto 24px;padding:34px 44px}
.frame.mesa{padding:0}
.disp{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
h2{font:600 28px Cinzel,serif;letter-spacing:.03em;margin:4px 0 6px}
.lead{color:var(--muted);max-width:1120px;font-size:15px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.gold{color:var(--gold2)}
.glass{background:linear-gradient(180deg,rgba(25,37,43,.96),rgba(18,27,32,.96));border:1px solid var(--line);box-shadow:0 10px 30px #0009,inset 0 1px 0 #ffffff10;border-radius:12px}
.parch{background:linear-gradient(180deg,#efe3c3,#e2d3ad);color:var(--ink);border:1px solid #b89a63;box-shadow:0 14px 34px #000a;border-radius:10px}
.parch .eyebrow{color:var(--bronze)}
.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#16232a;color:var(--text);font:600 14px 'Source Sans 3';display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,#e2bf78,#c99f55);color:#1a1206;border-color:#e7c98a}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.tag.prop{color:#b9b0e0;border-color:#4b4570}
.note{position:absolute;left:44px;right:44px;bottom:24px;font-size:13.5px;color:var(--dim)}
table.t{border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{border-bottom:1px solid #22323a;padding:6px 10px;text-align:left;vertical-align:top}
table.t th{color:var(--dim);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:#0f181c;white-space:nowrap;font-size:13px}
.chip b{font:600 15px Cinzel,serif;color:var(--gold2)}
.seal{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0f181c;border:2px solid var(--c)}
.seal .st{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;line-height:12px;min-width:14px;text-align:center;border-radius:6px;background:#0b1114;color:var(--ok);font-weight:700}
.order{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#0f181c;display:grid;place-items:center;font:700 11px 'Source Sans 3';color:var(--muted);text-align:center;line-height:1.1}
.order.used{border-color:var(--mark);background:#1b2a31;color:var(--text)}
.order.plan{border-style:dashed;border-color:var(--gold2);color:var(--gold2)}
.card{width:170px;height:238px;border-radius:10px;border:2px solid #7d5c33;background:var(--parch);color:var(--ink);overflow:hidden;position:relative;box-shadow:0 6px 16px #0008;display:flex;flex-direction:column}
.card .hd{height:26px;background:#2e4a5a;color:#f4ecd8;font:600 11px Cinzel,serif;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.card .art{height:62px;margin:8px 10px;border-radius:6px;background:#d9c9a3;display:grid;place-items:center}
.card .nm{font:600 15px Cinzel,serif;padding:0 10px}
.card .tx{font-size:12.5px;line-height:1.3;padding:4px 10px;color:#3c3122}
.card .ft{margin-top:auto;padding:6px 10px;font-size:11px;color:#6b5a3c;border-top:1px solid #b89a63;display:flex;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:#22323a;overflow:hidden}.bar i{display:block;height:100%;background:var(--muted)}
svg{display:block}
</style>
</head>
<body>
<div id="root"></div>
<script src="art-v22.js"></script>
<script>
const A=window.AOH,{city,citySeal,fort,piece,ship,banner,seal,emblem,hexD,CIV,borderStyle}=A;
const TER={PLAINS:'#71844f',FOREST:'#3f6148',HILLS:'#857c68',MOUNTAINS:'#646d69',SEA:'#264a5c',COAST:'#3f6d7c',UNK:'#1a2327'};
const SEAT={azul:'#6ca7d9',verde:'#5cb3a5',terra:'#d48a6a',violeta:'#a691d6'};
const frames=[];const F=(id,html,cls='')=>frames.push(`<section class="frame ${cls}" id="${id}">${html}</section>`);
const head=(eye,title,lead)=>`<div class="eyebrow">${eye}</div><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}`;
const sv=(w,h,body,vb)=>`<svg width="${w}" height="${h}" viewBox="${vb||`${-w/2} ${-h/2} ${w} ${h}`}">${body}</svg>`;
const hexTile=(r,t='PLAINS')=>`<path d="${hexD(r)}" fill="${TER[t]}" stroke="#0b111455"/>`;
const ERAS=['Fundação','Expansão','Consolidação','Civilização','Impérios','Potências','Ascensão'],RN=['I','II','III','IV','V','VI','VII'];
const RES=[['Alimento','#b2cf87',15],['Madeira','#c69a68',15],['Pedra','#aeb7b8',15],['Riqueza','#e6c173',15],['Metal','#9fb7c5',10],['Conhecimento','#94bed2',10],['Influência','#c4a7d4',10],['Cultura','#d9a8b8',10]];
function terrainAt(q,r,seed=1){const R=A.rng(seed*7919+q*131+r*977);const n=Math.sin(q*.55+seed)+Math.cos(r*.7-seed*.3)+Math.sin((q+r)*.35)*.8+R()*.5;if(q<3||(r>9&&q<6))return 'SEA';if(q<5)return 'COAST';return n>1.7?'MOUNTAINS':n>1.05?'HILLS':n<-.6?'FOREST':'PLAINS';}
function hexMap(o){const{cols,rows,R}=o;const S=Math.sqrt(3);let g='';const pos=(q,r)=>[o.ox+(q+(r&1)*.5)*S*R,o.oy+r*1.5*R];const tiles=[];
 for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const t=terrainAt(q,r,o.seed||1);const[x,y]=pos(q,r);const hid=o.hidden&&o.hidden(q,r);tiles.push({q,r,t,x,y});g+=`<path d="${hexD(R,x,y)}" fill="${hid?TER.UNK:TER[t]}" stroke="#0b111433"/>${hid?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="${R*.6}" fill="#3a4a50">?</text>`:''}`;}return{g,pos,tiles};}

/* 1 estrutura */
(()=>{let eras='';ERAS.forEach((e,i)=>{eras+=`<div class="glass" style="padding:12px 14px;flex:1;min-width:0;${i===6?'border-color:var(--gold)':''}"><div class="disp" style="font-size:26px;color:var(--gold2)">${RN[i]}</div><div class="disp" style="font-size:15px">${e}</div><div class="dim" style="font-size:12px;margin-top:6px">5 rodadas · patamar ${i+1} da Teia</div><div style="display:flex;gap:4px;margin-top:10px">${[1,2,3,4,5].map(r=>`<span style="flex:1;height:6px;border-radius:3px;background:${i<1?'var(--gold)':i===1&&r<3?'var(--gold)':'#22323a'}"></span>`).join('')}</div>${i===6?'<div class="tag" style="margin-top:10px;color:var(--gold2);border-color:var(--bronze)">Declaração de Hegemonia</div>':''}${i===0?'<div class="dim" style="font-size:12px;margin-top:8px">Pulso obrigatório</div>':''}</div>`;});
 F('p1',head('Regras V5.1a · 1','7 Eras × 5 rodadas × 5 Ordens','Padrão de 35 rodadas. Cada rodada, cada jogador autoriza 5 ações com Ordens. Hegemonia não é Era: a Era VII só abre a declaração. Sem Hegemonia, vence o maior Prestígio na rodada 35.')+
 `<div style="display:flex;gap:10px;margin-top:18px">${eras}</div>
 <div style="display:flex;gap:28px;margin-top:26px;align-items:flex-start"><div class="glass" style="padding:16px 18px;width:560px"><div class="eyebrow">Uma rodada</div><div style="display:flex;gap:10px;align-items:center;margin-top:10px">${['Cidade','Expedição','Avanço','Influência','Legado'].map((o,i)=>`<span class="order ${i<3?'used':i===3?'plan':''}">${o}</span>`).join('')}<span class="dim" style="margin-left:10px">5 Ordens · tipos podem repetir</span></div><p class="muted" style="margin-top:12px">A Ordem autoriza; não paga. Recursos e pré-requisitos continuam. Ações livres não gastam Ordem: responder propostas, 1 Manobra + 1 Reação, escolha do Pulso, postura defensiva, poder do Líder.</p></div>
 <div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Configuração</div><table class="t" style="margin-top:8px;width:100%"><tr><th>Parâmetro</th><th>Padrão</th><th>Faixa</th></tr><tr><td>Eras</td><td>7</td><td>3–7</td></tr><tr><td>Rodadas por Era</td><td>5</td><td>3–7</td></tr><tr><td>Ordens por rodada</td><td>5</td><td>3–6</td></tr><tr><td>Mapa · população inicial</td><td>Misto · 2</td><td>como hoje</td></tr></table></div></div>
 <div class="note">Curva: I–II exploração e primeira expansão · III especialização · IV civilizações maduras · V impérios · VI potências e Obras · VII corrida real por Hegemonia.</div>`);})();

/* shared mesa pieces */
function strip(o){const seals=[['valgard',SEAT.azul,1,'✓'],['thalos',SEAT.verde,0,'…'],['meridia',SEAT.terra,0,'✓']].map(([c,col,me,st])=>`<span class="seal${me?' me':''}" style="--c:${col}">${sv(22,22,emblem(CIV[c].em,0,0,.75,col,2),'-12 -12 24 24')}<span class="st">${st}</span></span>`).join('');
 return `<div class="glass" style="position:absolute;left:12px;right:12px;top:10px;height:52px;display:flex;align-items:center;gap:14px;padding:0 12px"><span class="disp" style="font-size:15px">Valgard</span><span class="muted">Era <b class="disp gold">${o.era||'II · Expansão'}</b> · Rodada <b class="disp gold">${o.round||'7 / 35'}</b> <span class="dim">(${o.sub||'2ª da Era'})</span></span><span class="tag">${o.phase||'Planejar · 1:12'}</span><span style="display:flex;gap:8px;margin-left:8px">${seals}</span>
 <span style="display:flex;align-items:center;gap:6px;margin-left:10px" title="Pressão do mundo"><span class="dim" style="font-size:11px">Pressão</span><span class="bar" style="width:70px"><i style="width:${o.press||45}%;background:${(o.press||45)>80?'var(--warn)':'var(--muted)'}"></i></span></span>
 <span style="margin-left:auto;display:flex;gap:6px"><span class="btn sm">Cofre</span><span class="btn sm">Livro</span><span class="btn sm" style="color:var(--dim)">Dicas</span></span></div>`;}
function tray(o){const used=o.used||[1,1,1,0,0];const names=o.names||['Cidade','Expedição','Avanço','Influência','Legado'];return `<div class="glass" style="position:absolute;right:12px;bottom:12px;height:72px;border-radius:36px;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px"><span class="dim" style="font-size:12px">Ordens<b class="disp" style="font-size:20px;color:var(--gold2);margin-left:6px">${used.filter(Boolean).length} / 5</b></span><span style="display:flex;gap:6px">${names.map((n,i)=>`<span class="order ${used[i]===1?'used':used[i]===2?'plan':''}" style="width:46px;height:46px;font-size:10px">${n}</span>`).join('')}</span>${o.warn?`<span class="warn" style="font-size:13px">${o.warn}</span>`:''}<span class="btn ${o.primary===false?'':'primary'}" style="border-radius:24px">${o.cta||'Confirmar planejamento ›'}</span></div>`;}

/* 2 HUD */
(()=>{const R=40,M=hexMap({cols:22,rows:14,R,ox:0,oy:30,seed:2});let g=M.g;const at=(q,r,s)=>{const[x,y]=M.pos(q,r);return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${s}</g>`;};
 g+=at(10,5,city(4,R,{col:SEAT.azul,seed:11})+fort(2,R)+`<g transform="translate(28,-20)">${banner('valgard',SEAT.azul,30)}</g>`);g+=at(7,8,city(2,R,{col:SEAT.azul,seed:4}));g+=at(15,8,city(3,R,{col:SEAT.verde,seed:8})+`<g transform="translate(26,-18)">${banner('thalos',SEAT.verde,26)}</g>`);
 g+=at(12,6,piece('infantaria',SEAT.azul,34,{n:3}));g+=at(13,4,piece('explorador',SEAT.azul,34));g+=at(9,7,piece('pioneiro',SEAT.azul,34));g+=at(3,6,`<g transform="rotate(-15)">${ship('batel',SEAT.azul,46)}</g>`);
 const[px,py]=M.pos(10,5);g+=`<g transform="translate(${px},${py-R-16})"><rect x="-26" y="-9" width="52" height="18" rx="9" fill="#e8dbbb" stroke="#0b1114"/><text y="4" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="11" fill="#2a2116">N4 · 2</text></g>`;
 const map=`<svg width="1440" height="900" style="position:absolute;inset:0"><rect width="1440" height="900" fill="#0b1114"/>${g}</svg>`;
 const cardHtml=`<div class="glass" style="position:absolute;right:12px;top:74px;width:360px;padding:14px 16px"><div class="eyebrow">Cidade · N4 Cidade · Capacidade 2</div><h3 class="disp" style="font-size:20px;color:var(--gold2);margin:4px 0">Passo de Valgard</h3><div class="muted" style="font-size:13px">8 habitantes · Ânimo <b class="ok">Próspera</b> (+1 Capacidade na 1ª ativação) · Muralha de Pedra íntegra</div><div style="display:flex;gap:6px;margin:10px 0 6px"><span class="tag">ativações 1 / 2</span><span class="tag prop">2ª ativação: −1 Ânimo</span></div>
 <div style="display:grid;gap:6px;margin-top:8px"><div class="glass" style="padding:10px;border-color:var(--mark)"><b>Produzir</b> <span class="dim">· Ordem Cidade</span><div class="muted" style="font-size:13px">Colhe o centro + 3 hexes trabalhados (Capacidade 2 + Próspera): +4 Alimento, +2 Madeira, +1 Pedra, +1 Conhecimento</div></div><div class="glass" style="padding:10px"><b>Construir</b> <span class="dim">· 1 construção</span><div class="muted" style="font-size:13px">Mercado 2 Madeira 2 Riqueza · Fortaleza 5 Pedra 2 Metal (Era III)</div></div><div class="glass" style="padding:10px"><b>Recrutar</b> <span class="dim">· até 2 peças</span></div><div class="glass" style="padding:10px"><b>Governar</b> <span class="dim">· +1 Ânimo (1 Cultura) · reparo 1 Pedra</span></div></div></div>`;
 const pulse=`<div class="glass" style="position:absolute;left:16px;top:74px;padding:6px 12px;font-size:13px;color:var(--muted)">Pulso da Era II: <b class="gold">Ventos de Travessia</b> · +1 Riqueza para todos · Pressão 5 / 8</div>`;
 const fan=`<div style="position:absolute;left:30px;bottom:-30px;width:240px;height:110px">${[0,1,2].map(i=>`<div class="card" style="position:absolute;left:${i*34}px;top:${Math.abs(i-1)*5}px;transform:rotate(${(i-1)*7}deg);width:84px;height:118px"><div class="hd" style="height:18px;font-size:9px">${i===2?'Valgard':'Manobra'}</div></div>`).join('')}</div>`;
 F('p2',map+strip({press:62})+pulse+cardHtml+fan+tray({used:[1,1,0,0,0],warn:'Passo de Valgard sem ação'}),'mesa');
 F('p2b',`<div style="position:absolute;inset:0;background:#0b1114"></div>`+head('Regras V5.1a · 2','HUD da rodada: o que fica sempre visível','A Faixa cresce três coisas: a rodada dentro da Era (7 / 35, 2ª da Era), a barra de Pressão do Mundo e o Livro com ponto quando algo espera. A Bandeja troca "ações 2 / 7" por 5 fichas de Ordem. O resto permanece sob demanda.')+
 `<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px"><div class="glass" style="padding:16px"><div class="eyebrow">Sempre</div><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px"><li>Era e rodada (7 / 35 · 2ª da Era)</li><li>Fase e prazo</li><li>Selos dos lugares com ✓ / …</li><li>Pressão do Mundo (barra de 70 px; pulsa só perto do limiar)</li><li>5 fichas de Ordem e um CTA dourado</li><li>Cidade: selo N·Capacidade e cor da praça = Ânimo</li></ul></div><div class="glass" style="padding:16px"><div class="eyebrow">Sob demanda</div><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px"><li>Cofre: 8 recursos atual/limite</li><li>Livro: Conselho · Teia · Cartas · Diplomacia · Eras & Hegemonia · Crônicas</li><li>Cartão da seleção</li><li>Prévias de exploração ao passar sobre uma Região oculta</li><li>Encontros e Pulsos como pergaminho, uma decisão de cada vez</li></ul></div></div>
 <div style="margin-top:22px">${tray({used:[1,1,2,0,0]}).replace('position:absolute;right:12px;bottom:12px;','position:relative;display:inline-flex;')}</div><div class="dim" style="margin-top:8px;font-size:13px">Ficha cheia = Ordem gasta · tracejada dourada = planejada nesta rodada · vazia = disponível. Passar o mouse numa ficha lista o que ela autoriza.</div>`,'');})();

/* 3 bandeja */
(()=>{const row=(n,a,ex)=>`<div class="glass" style="padding:12px 14px;display:flex;gap:14px;align-items:center"><span class="order used" style="flex:none">${n}</span><div style="flex:1"><b>${a}</b><div class="muted" style="font-size:13px">${ex}</div></div></div>`;
 F('p3',head('Regras V5.1a · 3','Bandeja das 5 Ordens','Cada ação principal planejada ocupa uma ficha. Ao confirmar, as Ordens viram ações na resolução. A Ordem autoriza; a cidade, a peça e os recursos ainda precisam existir.')+
 `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">${row('Cidade','Produzir · Construir · Recrutar · Governar','Ativa uma cidade. Máx. 2 ativações por cidade por rodada; a 2ª custa 1 nível de Ânimo.')}${row('Expedição','mover · explorar · fundar · embarcar · desembarcar · atacar','Uma pilha ou peça. Entrar em cidade inimiga é sempre ataque.')}${row('Avanço','pesquisar','Um avanço da Teia ou de Herança. Custo em Conhecimento (+ recurso temático).')}${row('Influência','tratado · oferta · rota · missão cultural · povo · integração','Enviado, cidade ou civilização. Responder a propostas é livre.')}${row('Legado','Obra de Legado · empreendimento excepcional','Iniciar/avançar uma Obra; declarar Hegemonia (Era VII); reforma de governo.')}<div class="glass" style="padding:12px 14px;border-color:var(--bronze)"><div class="eyebrow">Livres (sem Ordem)</div><div class="muted" style="font-size:13px;margin-top:6px">1 Manobra proativa + 1 Reação · escolha do Pulso · postura defensiva · poder do Líder · cancelar antes de confirmar</div></div></div>
 <div style="margin-top:22px;display:flex;gap:30px;align-items:center">${tray({used:[1,1,1,2,0],cta:'Confirmar planejamento ›'}).replace('position:absolute;right:12px;bottom:12px;','position:relative;display:inline-flex;')}<div class="muted" style="max-width:500px;font-size:13.5px">Antes de confirmar, com Ordem sobrando: aviso curto na própria Bandeja ("1 Ordem livre"), nunca um modal. Com Ordem a mais que o permitido, a ficha fica vermelha e a última ação pede escolha.</div></div>`);})();

/* 4 cidade */
(()=>{const r=60;const names=['Posto','Aldeia','Vila','Cidade','Grande Cidade','Metrópole','Imperial'],pop=[2,4,6,8,11,14,18],cap=[1,1,2,2,3,3,4],slots=[1,1,2,3,4,5,6],sup=[2,2,3,3,4,4,5];
 const rise=['—','3 Madeira · Agricultura · Era I','4 Madeira 2 Pedra · Alvenaria · II','5 Madeira 3 Pedra 2 Riqueza · Engenharia · III','6 Mad. 5 Ped. 3 Riq. 2 Conhec. · Urbanismo · IV','8 Mad. 6 Ped. 5 Riq. 3 Conhec. · Saneamento · V','10 Mad. 8 Ped. 8 Riq. 4 Conhec. · Metrópoles do Mundo · só Era VII'];
 let cells='';for(let l=1;l<=7;l++)cells+=`<div style="width:176px;text-align:center">${sv(150,132,hexTile(r+3)+city(l,r,{col:SEAT.azul,seed:3})+`<g transform="translate(-40,-42)"><rect x="-22" y="-9" width="44" height="18" rx="9" fill="#e8dbbb" stroke="#0b1114"/><text y="4" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="11" fill="#2a2116">N${l} · ${cap[l-1]}</text></g>`)}<div class="disp" style="font-size:13px">${l} · ${names[l-1]}</div><div class="dim" style="font-size:12px">${pop[l-1]}+ hab. · Cap. ${cap[l-1]} · ${slots[l-1]} vaga${slots[l-1]>1?'s':''} · supr. ${sup[l-1]}</div><div style="font-size:11.5px;color:#94bed2;margin-top:2px">${rise[l-1]}</div></div>`;
 const mood=[['Próspera','#55704a','+1 Capacidade na 1ª ativação'],['Estável','#a39780','normal'],['Abalada','#b08a52','−1 Capacidade (mín. 1); sem 2ª ativação'],['Revolta','#8a4a3a','só Governar/recuperação; não produz']];

/* 8 líder */
(()=>{const leader=(n,t,cr,pa,po,af,col)=>`<div class="card" style="width:250px;height:330px"><div class="hd" style="background:#4b3d5c">Líder · Valgard ${sv(16,22,banner('valgard',col,28),'-12 -36 24 38')}</div><div class="art" style="height:70px">${sv(70,70,seal('valgard',col,22),'-30 -30 60 60')}</div><div class="nm">${n}</div><div class="tx" style="color:#6b5a3c;font-style:italic;font-family:'Cormorant Garamond';font-size:14px">${t} · “${cr}”</div><div class="tx"><b>Passiva</b> ${pa}</div><div class="tx"><b>Poder · 1× por Era</b> ${po}</div><div class="ft"><span>Afinidade ${af}</span><span>sem custo</span></div></div>`;
 F('p8',head('Regras V5.1a · 8','Carta de Líder: escolha 1 de 2 na preparação','Só seis campos: nome, título, crônica curta, passiva, poder 1× por Era, afinidade. O poder volta na passagem de Era. Sem miniatura no mapa neste corte.')+
 `<div style="display:flex;gap:28px;margin-top:18px;align-items:flex-start">${leader('Toren Hjalvar','Senhor das Passagens','Quem guarda o portão guarda o vale.','Peças em território próprio estão sempre supridas.','Muralha Viva: +2 Força nos conflitos desta rodada.','Guerra',SEAT.azul)}${leader('Ysolde Varn','Guardiã dos Refúgios','Um teto para cada inverno.','Governar em cidade fortificada recupera +1 Ânimo.','Portões Abertos: uma cidade em Revolta volta a Abalada.','Sociedade',SEAT.azul)}<div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Na Mesa</div><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px;font-size:13.5px"><li>Na preparação, duas cartas lado a lado; a escolhida vira o selo do jogador na Faixa.</li><li>O poder aparece como botão no Cartão da civilização (Livro · Conselho) e como Manobra livre quando a situação pede.</li><li>Poder usado = selo com meia-lua apagada até a próxima Era.</li><li>Cada civilização terá 2 Líderes originais; as 6 em autoria recebem os seus quando a história for escrita.</li></ul></div></div>`);})();

/* 9 manobra */
(()=>{const m=(fam,n,tx,cost,tag,bg)=>`<div class="card"><div class="hd" style="background:${bg}">${fam}<span style="font-size:9px;opacity:.8">${tag}</span></div><div class="art">${sv(50,50,piece('infantaria','#2a2116',40),'-25 -25 50 50')}</div><div class="nm">${n}</div><div class="tx">${tx}</div><div class="ft"><span>${cost}</span><span>${tag==='Reação'?'Conflitos':'Planejar'}</span></div></div>`;
 F('p9',head('Regras V5.1a · 9','Manobras: uma família, três tags','Ações, táticas e reações no mesmo baralho, diferenciadas por tag. Mão máxima 5; começa com 3, +1 por Era. Por rodada: 1 proativa + 1 Reação. Efeitos fortes custam recursos. Uma Manobra nunca substitui uma Ordem, salvo texto explícito.')+
 `<div style="display:flex;gap:16px;margin-top:18px">${m('Manobra','Marcha Forçada','Uma pilha +1 movimento nesta rodada.','0','Ação','#2e4a5a')}${m('Manobra','Linha de Escudos','+1 Força nos conflitos desta rodada; +2 se a pilha estiver em território próprio.','1 Metal','Reação','#5a3a3a')}${m('Manobra','Feira Extraordinária','+3 Riqueza. Se houver acordo comercial ativo, +1 Cultura.','1 Influência','Ação','#2e4a5a')}${m('Manobra','Caravana de Emergência','Mova até 3 recursos de uma cidade sitiada para outra ligada por estrada.','2 Riqueza','Tática','#3a4a2e')}${m('Manobra · Valgard','Passagem Guardada','Uma pilha em território próprio +1 Força. Volta à mão a cada Era.','0','Herança','#3c3550')}</div>
 <div class="glass" style="padding:14px 16px;margin-top:22px;width:900px"><div class="eyebrow">Leque na Mesa</div><div class="muted" style="font-size:13.5px;margin-top:6px">Recolhido na borda inferior esquerda; levanta no hover; uma carta em foco por vez com o único botão dourado ("Jogar"). Tag em cor na faixa do topo da carta. Quando o efeito atinge peça ou cidade, o alvo recebe selo no mapa.</div></div>`);})();

/* 10 ambição */
(()=>{const amb=(n,tx,p,prog)=>`<div class="card" style="height:220px"><div class="hd" style="background:#4a3b2a">Ambição<span style="font-size:9px">secreta</span></div><div class="nm" style="margin-top:12px">${n}</div><div class="tx">${tx}</div><div style="padding:0 10px;margin-top:auto"><div class="bar" style="background:#cdbb98"><i style="width:${prog}%;background:#7d5c33"></i></div></div><div class="ft"><span>${p} Prestígio</span><span>${prog}%</span></div></div>`;
 F('p10',head('Regras V5.1a · 10','Ambições: 3 → 2, no máximo 1 pontuada por Era','Objetivos pessoais secretos de 2 / 3 / 4 Prestígio. Na passagem de Era, uma não concluída pode ser trocada. Cobrem exploração, economia, cidades, cultura, diplomacia, guerra, ciência, naval e Legado.')+
 `<div style="display:flex;gap:16px;margin-top:18px;align-items:flex-start">${amb('Horizonte Ampliado','Revele 6 Regiões.',2,66)}${amb('Rede de Cidades','Tenha 3 cidades N3+ ligadas por estrada.',3,33)}${amb('Costa das Marés','Tenha 2 portos e um navio em cada mar conhecido.',4,25)}<div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Escolha inicial</div><div class="muted" style="font-size:13.5px;margin-top:6px">Três cartas abertas, você guarda duas. A terceira volta ao baralho. Nenhuma ambição exige derrotar um jogador específico.</div><div class="eyebrow" style="margin-top:14px">Famílias</div><div class="muted" style="font-size:13px;margin-top:4px">Exploração · Economia · Cidades · Cultura · Diplomacia · Guerra · Ciência · Naval · Legado — 3 cartas por família, uma em cada dificuldade.</div><div class="eyebrow" style="margin-top:14px">UI</div><div class="muted" style="font-size:13px;margin-top:4px">Livro · Cartas mostra as 2 ativas com barra de progresso; a pontuação acontece na Virada de Era, nunca no meio da rodada.</div></div></div>`);})();

/* 11 pulso */
(()=>{F('p11',head('Regras V5.1a · 11','Pressão decide quando · Pulso decide o quê · Teia decide como','Um Pulso obrigatório no início de cada Era. Grandes feitos somam Pressão; ao atingir 4 + 2 × jogadores, dispara um Pulso extra e zera. Toda carta de Pulso é condicional e traz a linha "mitigado por": é assim que a tecnologia protege.')+
 `<div style="display:flex;gap:28px;margin-top:18px;align-items:flex-start"><div class="parch" style="width:560px;padding:16px 18px"><div class="eyebrow">Pulso do Mundo · Era III</div><h3 class="disp" style="font-size:22px;margin:4px 0">Seca Regional</h3><p style="font-size:14px">Chuvas falham nas planícies. Cada cidade: <b>sem Irrigação −2 Alimento</b>; <b>com Irrigação −1</b>; <b>com distrito Agrário, nada</b>. Quem perder Alimento escolhe: pagar agora ou <b>−1 Ânimo</b> na cidade.</p><div style="display:flex;gap:8px;margin-top:12px"><span class="btn sm" style="background:#2a2116;color:#f4ecd8;border-color:#2a2116">Pagar 3 Alimento (2 cidades)</span><span class="btn sm" style="background:#2a2116;color:#f4ecd8;border-color:#2a2116">−1 Ânimo em Aldeia do Vau</span></div><div style="font-size:12px;color:#6b5a3c;margin-top:10px">Severidade média · <b>mitigado por</b> Irrigação (Teia II) · Agrário · Celeiro</div></div>
 <div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Pressão do Mundo</div><table class="t" style="margin-top:6px;width:100%"><tr><td>Fundação de cidade</td><td>+1</td></tr><tr><td>Declaração de guerra</td><td>+2</td></tr><tr><td>Captura de cidade</td><td>+2</td></tr><tr><td>Elevar a N5+</td><td>+1</td></tr><tr><td>Convergência pesquisada</td><td>+1</td></tr><tr><td>Obra concluída</td><td>+2</td></tr><tr><td>Encontro extraordinário</td><td>+1</td></tr><tr><th>Limiar</th><th>4 + 2 × jogadores (2j 8 · 4j 12 · 6j 16)</th></tr></table><div style="display:flex;align-items:center;gap:8px;margin-top:12px"><span class="dim" style="font-size:12px">Pressão 9 / 12</span><span class="bar" style="width:220px;height:10px"><i style="width:75%;background:var(--warn)"></i></span></div><div class="eyebrow" style="margin-top:14px">Outros Pulsos condicionais</div><div class="muted" style="font-size:12.5px;margin-top:4px">Colheita Farta (Fazenda +1; Celeiro guarda além do limite) · Epidemia (N4+ sem Saneamento −1 hab.; com, −1 Ânimo) · Migração (+1 Disponível na cidade de maior Ânimo) · Rotas Instáveis (rotas sem Farol/Estrada rendem 0) · Descoberta Partilhada (Academia 2 Conh.; outros 1 Conh.).</div></div></div>`);})();

/* 12 encontro */
(()=>{F('p12',head('Regras V5.1a · 12','Encontro: a descoberta tem duas respostas','Quando a exploração revela algo narrativo (ruína, povo, perigo, passagem, porto natural), um Encontro aparece como pergaminho ao lado da Região, com duas escolhas e consequência imediata.')+
 `<div style="display:flex;gap:28px;margin-top:18px;align-items:flex-start">${sv(360,300,hexTile(150,'HILLS')+`<circle r="40" fill="#5a5247" stroke="#0b1114" stroke-width="2"/><path d="M-22,10 L-10,-22 L10,-22 L22,10 Z" fill="#8a8072" stroke="#0b1114"/><path d="M-30,30 L30,30" stroke="#0b1114" stroke-width="3"/>`+`<g transform="translate(90,-60)">${piece('explorador',SEAT.azul,44)}</g>`)}
 <div class="parch" style="width:520px;padding:16px 18px"><div class="eyebrow">Encontro · Ruína nas Colinas</div><h3 class="disp" style="font-size:22px;margin:4px 0">Salão dos Mestres Esquecidos</h3><p style="font-size:14px">Sob a laje, instrumentos antigos e um mapa de rotas gasto.</p><div style="display:grid;gap:8px;margin-top:12px"><div style="border:1px solid #b89a63;border-radius:6px;padding:8px 10px"><b>Estudar os instrumentos</b><div style="font-size:13px;color:#4a3d2a">+3 Conhecimento. Se tiver Registros de Sinais, +1 Cultura.</div></div><div style="border:1px solid #b89a63;border-radius:6px;padding:8px 10px"><b>Seguir o mapa</b><div style="font-size:13px;color:#4a3d2a">Revela a Região vizinha mais próxima do mar. Pressão +1.</div></div></div><div style="font-size:12px;color:#6b5a3c;margin-top:10px">Uma escolha; o Explorador não gasta a Ordem de novo.</div></div>
 <div class="glass" style="padding:14px 16px;flex:1"><div class="eyebrow">Tipos</div><ul class="muted" style="padding-left:18px;margin-top:6px;display:grid;gap:6px;font-size:13.5px"><li>Ruína: recurso civilizacional ou prévia</li><li>Povo independente: primeiro contato e atitude</li><li>Perigo: bando ou tempestade; pode custar uma peça</li><li>Passagem/porto natural: estrada ou ancoradouro grátis</li><li>Extraordinário: +1 Prestígio e Pressão +1</li></ul></div></div>`);})();

/* 13 exploração */
(()=>{const R=40,M=hexMap({cols:22,rows:14,R,ox:0,oy:30,seed:5,hidden:(q,r)=>!(q>=6&&q<=12&&r>=5&&r<=10)});let g=M.g;const at=(q,r,s)=>{const[x,y]=M.pos(q,r);return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${s}</g>`;};
 g+=at(9,6,city(3,R,{col:SEAT.azul,seed:11}));g+=at(12,5,piece('explorador',SEAT.azul,36));
 // region outlines: three candidate regions around explorer
 const regions=[[15,5,'Floresta provável · costa a leste','FOREST'],[14,9,'Colinas · indício de Metal','HILLS'],[9,2,'Desconhecido · sem prévia','UNK']];
 regions.forEach(([q,r,label,t],i)=>{const[x,y]=M.pos(q,r);const pts=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[r&1?1:-1,1],[r&1?1:-1,-1]];let d='';pts.forEach(([dq,dr])=>{const[hx,hy]=M.pos(q+dq,r+dr);d+=hexD(R*.98,hx,hy);});g+=`<path d="${d}" fill="${i===0?'#f4ecd81a':'none'}" stroke="${i===0?'#f4ecd8':'#f4ecd866'}" stroke-width="${i===0?2.5:1.5}" stroke-dasharray="${i===0?'none':'5 4'}"/>`;
  g+=`<g transform="translate(${x},${y-R*2.2})"><rect x="-96" y="-12" width="192" height="24" rx="12" fill="#e8dbbb" stroke="#0b1114"/><text y="4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a2116">${label}</text></g>`;
  if(t!=='UNK'){g+=`<path d="${hexD(14,x,y)}" fill="${TER[t]}" stroke="#f4ecd8" stroke-width="1.5"/>`;}});
 const map=`<svg width="1440" height="900" style="position:absolute;inset:0"><rect width="1440" height="900" fill="#0b1114"/>${g}</svg>`;
 const card=`<div class="glass" style="position:absolute;right:12px;top:74px;width:360px;padding:14px 16px"><div class="eyebrow">Explorador · Ordem Expedição</div><h3 class="disp" style="font-size:20px;color:var(--gold2);margin:4px 0">Explorar uma Região</h3><p class="muted" style="font-size:13.5px">Escolha qual Região oculta revelar. O conteúdo é o que existe no mundo; nada gira depois de conhecido.</p><div class="glass" style="padding:10px 12px;margin-top:10px;border-color:var(--mark)"><b>Região a leste</b><div class="muted" style="font-size:13px">Prévia (Registros de Sinais + Redes de Observatórios): Floresta predominante · costa a leste · sem perigo detectado</div></div><div class="dim" style="font-size:12.5px;margin-top:8px">Sem avanços de prévia, a Região aparece só como “?”.</div><div style="margin-top:12px"><span class="btn primary">Explorar a leste · 1 Ordem</span></div></div>`;
 F('p13',map+strip({press:40})+card+tray({used:[1,1,2,0,0],primary:false,cta:'Confirmar planejamento ›'}),'mesa');})();

/* 14 passagem de era */
(()=>{const step=(n,t,d,st)=>`<div class="glass" style="padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-color:${st==='now'?'var(--mark)':st==='done'?'#33474f':'#22323a'};opacity:${st==='lock'?.6:1}"><span class="order ${st==='done'?'used':st==='now'?'plan':''}" style="width:34px;height:34px;flex:none;font-size:13px">${n}</span><div><b>${t}</b><div class="muted" style="font-size:13px">${d}</div></div></div>`;
 F('p14',head('Regras V5.1a · 14','Virada de Era: um painel, cinco passos, um CTA','Após a 5ª rodada. A Mesa escurece, o painel ocupa o centro e cada passo pede no máximo uma decisão. Tudo o que é automático aparece já resolvido.')+
 `<div style="display:grid;grid-template-columns:560px 1fr;gap:28px;margin-top:16px"><div style="display:grid;gap:8px">${step('1','Efeitos de fim de Era','Manutenção da Era, Sobre-extensão, Ânimo por Alimento excedente (+1).','done')}${step('2','Ambição','Pontuar no máximo 1 concluída (3 Prestígio: Rede de Cidades). Trocar uma não concluída?','now')}${step('3','Líder e cartas','Poder de Toren Hjalvar volta. +1 Manobra (mão 4/5). Reações usadas voltam ao baralho.','lock')}${step('4','Governo e Teia','Reforma elegível: Conselho → Monarquia (3 Influência). Patamar III da Teia aberto.','lock')}${step('5','Era III · Consolidação','Pulso obrigatório: Estações Irregulares. Pressão volta a 0. Rodada 11 / 35.','lock')}</div>
 <div class="glass" style="padding:16px 18px;align-self:start"><div class="eyebrow">Passo 2 · Ambição</div><div style="display:flex;gap:12px;margin-top:10px"><div class="card" style="width:150px;height:200px;border-color:#9ec4a2"><div class="hd" style="background:#4a3b2a">Ambição</div><div class="nm" style="margin-top:10px">Rede de Cidades</div><div class="tx">3 cidades N3+ ligadas por estrada.</div><div class="ft"><span class="ok">Concluída</span><span>+3</span></div></div><div class="card" style="width:150px;height:200px"><div class="hd" style="background:#4a3b2a">Ambição</div><div class="nm" style="margin-top:10px">Costa das Marés</div><div class="tx">2 portos e um navio em cada mar.</div><div class="ft"><span>25%</span><span>trocar?</span></div></div></div><div style="display:flex;gap:8px;margin-top:14px"><span class="btn sm">Manter</span><span class="btn sm">Trocar por nova</span><span class="btn primary sm" style="margin-left:auto">Pontuar e seguir ›</span></div></div></div>`);})();

/* 15 hegemonia */
(()=>{const path=(n,reqs,col,me)=>`<div class="glass" style="padding:12px 14px;border-color:${me?'var(--gold)':'#33474f'}"><div style="display:flex;justify-content:space-between;align-items:center"><b class="disp" style="font-size:15px">${n}</b>${me?'<span class="tag" style="color:var(--gold2);border-color:var(--bronze)">declarada · 1 / 2 rodadas</span>':''}</div><ul style="list-style:none;margin-top:8px;display:grid;gap:4px;font-size:13px">${reqs.map(([t,ok])=>`<li style="display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:${ok?'var(--ok)':'#33474f'};border:1px solid ${ok?'var(--ok)':'var(--dim)'}"></span><span class="${ok?'':'muted'}">${t}</span></li>`).join('')}</ul></div>`;
 F('p15',head('Regras V5.1a · 15','Corrida por Hegemonia: Era VII','Seis caminhos, três requisitos objetivos cada. Declarar (Ordem Legado) só com os três cumpridos; sustentar 2 rodadas completas; vitória imediata. Todos veem quem declarou e o que falta aos outros. Sem Hegemonia até a rodada 35: maior Prestígio.')+
 `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px">${path('Militar',[['Força total ≥ 14',1],['3 vitórias',1],['2 cidades capturadas ou integradas',1]],SEAT.azul,true)}${path('Econômica',[['Riqueza no limite',1],['3 rotas internacionais',0],['Entreposto das Marés ou 2 Tesouros',1]])}${path('Científica',[['Comunidade de Descoberta',1],['3 Observatórios/Academias',0],['2 Heranças',1]])}${path('Cultural',[['Memória do Mundo',0],['Presença Predominante em 3 cidades',0],['Monumento das Vozes',1]])}${path('Política',[['Conselho de Civilizações',0],['Aliança com 2 civilizações',1],['1 povo integrado',1]])}${path('Territorial',[['20 hexes',1],['2 cidades N5+',1],['Estrada das Comunidades',0]])}</div>
 <div style="display:flex;gap:28px;margin-top:18px;align-items:center"><div class="glass" style="padding:12px 16px;display:flex;gap:16px;align-items:center"><span class="seal" style="--c:${SEAT.azul}">${sv(22,22,emblem('passo',0,0,.75,SEAT.azul,2),'-12 -12 24 24')}</span><div><b>Valgard declarou Hegemonia Militar</b><div class="muted" style="font-size:13px">Sustenta há 1 rodada. Se mantiver os 3 requisitos até o fim da rodada 33, vence.</div></div><span class="bar" style="width:140px;height:10px"><i style="width:50%;background:var(--gold)"></i></span></div><div class="muted" style="font-size:13.5px;max-width:520px">Na Faixa, uma declaração vira uma linha dourada sob o selo de quem declarou, visível a todos. Em Livro · Eras & Hegemonia, cada jogador vê só os 2 caminhos mais próximos por padrão; “ver todos” abre os seis.</div></div>`);})();

/* 16b governos */
(()=>{const gov=[['Conselho (inicial)','—','Governar −1; Capacidade Administrativa +1','máx. 1 segunda ativação por rodada'],['Monarquia','Centralização','capital +1 Capacidade; Recrutar na capital ignora Capacidade','mudar de capital custa 2 Ordens'],['República','Federalização','2 Ambições pontuadas por Era; +1 Manobra na mão','declarar guerra: +1 Influência e 1 Ordem Influência'],['Oligarquia','Moeda','rotas +1 Riqueza; Riqueza cobre 60% em qualquer custo','cidades Abaladas não geram Riqueza'],['Teocracia','Escolas de Expressão','Templo recupera Ânimo 1×/rodada sem Ordem; Cultura +1 por Templo','Saber: 1º avanço por Era custa +1 Conh.'],['Confederação','Federalização','Capacidade Administrativa +2; fundar −1 Madeira','Capacidade da capital nunca passa de 3'],['Meritocracia','Academias Cívicas','Erudito rende por 1; Governar +1 Conhecimento','Recrutar ≤ 1 peça por ativação'],['Autocracia','Centralização + Fortificação','Exército máx. +1; peças supridas a 1 hex de estrada','conquista começa em Integração 0 e Revolta']];
 const rows=gov.map(([n,a,v,l],i)=>`<tr style="${i===0?'opacity:.75':''}"><td class="disp" style="font-size:13px">${n}</td><td class="dim">${a}</td><td class="ok">${v}</td><td class="bad">${l}</td></tr>`).join('');
 F('p16b',head('Regras V5.1a · 16','Sete governos, um orçamento','Cada governo: 2 vantagens e 1 limitação, escritas em Ânimo, Administração, economia, pesquisa, guerra, diplomacia, Ordens ou custos. Nenhuma usa Estabilidade ou Coesão. Trocar: Ordem Legado + Influência (4 até a Era III, 6 depois) + o avanço que o abre; a capital fica Abalada por 1 rodada.')+
 `<table class="t" style="margin-top:14px;width:100%"><tr><th>Governo</th><th>Abre com</th><th>Vantagens</th><th>Limitação</th></tr>${rows}</table><div class="note">Livro · Conselho mostra só o governo atual e os elegíveis agora; os outros aparecem em cinza com o avanço que falta.</div>`);})();

/* 16 tabela */
F('p16',head('Regras V5.1a · Síntese','Regra · por que · decisão · risco · como a UI esconde','')+`<table class="t" style="margin-top:10px;width:100%;font-size:12.5px"><tr><th>Regra</th><th>Por que existe</th><th>Que decisão cria</th><th>Risco de complexidade</th><th>Como a UI esconde</th></tr>
<tr><td>5 Ordens</td><td>tempo escasso, não recursos infinitos</td><td>o que fazer esta rodada</td><td>contar ordens</td><td>5 fichas na Bandeja; cada ação ocupa uma ao planejar</td></tr>
<tr><td>Capacidade</td><td>um multiplicador urbano</td><td>crescer uma cidade × fundar outra</td><td>tabela</td><td>selo N·Capacidade; Cartão diz “colhe 3 hexes”</td></tr>
