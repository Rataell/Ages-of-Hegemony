<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AoH Regras V5.1b FINAL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--night:#0b1114;--stone:#121b20;--steel:#19252b;--steel2:#22323a;--line:#33474f;--bronze:#7d5c33;--gold:#c9a45c;--gold2:#e7c98a;--parch:#e8dbbb;--ink:#2a2116;--text:#eee8da;--muted:#b3c0bd;--dim:#93a3a0;--ok:#9ec4a2;--warn:#e5bf72;--bad:#e59a86;--mark:#f4ecd8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05090b;color:var(--text);font:14px/1.45 'Source Sans 3',system-ui,sans-serif}
.frame{position:relative;width:1440px;min-height:900px;overflow:hidden;background:var(--night);margin:0 auto 24px;padding:34px 44px 70px;box-sizing:border-box}
.frame.mesa{height:900px;padding:0}
table.t{table-layout:auto;max-width:100%;word-break:normal}
.disp{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
h2{font:600 28px Cinzel,serif;letter-spacing:.03em;margin:4px 0 6px}
.lead{color:var(--muted);max-width:1120px;font-size:15px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.gold{color:var(--gold2)}
.glass{background:linear-gradient(180deg,rgba(25,37,43,.96),rgba(18,27,32,.96));border:1px solid var(--line);box-shadow:0 10px 30px #0009,inset 0 1px 0 #ffffff10;border-radius:12px}
.parch{background:linear-gradient(180deg,#efe3c3,#e2d3ad);color:var(--ink);border:1px solid #b89a63;box-shadow:0 14px 34px #000a;border-radius:10px}
.parch .eyebrow{color:var(--bronze)}
.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#16232a;color:var(--text);font:600 14px 'Source Sans 3';display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,#e2bf78,#c99f55);color:#1a1206;border-color:#e7c98a}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.tag.prop{color:#b9b0e0;border-color:#4b4570}
.note{position:absolute;left:44px;right:44px;bottom:24px;font-size:13.5px;color:var(--dim)}
table.t{border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{border-bottom:1px solid #22323a;padding:6px 10px;text-align:left;vertical-align:top}
table.t th{color:var(--dim);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:#0f181c;white-space:nowrap;font-size:13px}
.chip b{font:600 15px Cinzel,serif;color:var(--gold2)}
.seal{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0f181c;border:2px solid var(--c)}
.seal .st{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;line-height:12px;min-width:14px;text-align:center;border-radius:6px;background:#0b1114;color:var(--ok);font-weight:700}
.order{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:#0f181c;display:grid;place-items:center;font:700 11px 'Source Sans 3';color:var(--muted);text-align:center;line-height:1.1}
.order.used{border-color:var(--mark);background:#1b2a31;color:var(--text)}
.order.plan{border-style:dashed;border-color:var(--gold2);color:var(--gold2)}
.card{width:170px;height:238px;border-radius:10px;border:2px solid #7d5c33;background:var(--parch);color:var(--ink);overflow:hidden;position:relative;box-shadow:0 6px 16px #0008;display:flex;flex-direction:column}
.card .hd{height:26px;background:#2e4a5a;color:#f4ecd8;font:600 11px Cinzel,serif;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.card .art{height:62px;margin:8px 10px;border-radius:6px;background:#d9c9a3;display:grid;place-items:center}
.card .nm{font:600 15px Cinzel,serif;padding:0 10px}
.card .tx{font-size:12.5px;line-height:1.3;padding:4px 10px;color:#3c3122}
.card .ft{margin-top:auto;padding:6px 10px;font-size:11px;color:#6b5a3c;border-top:1px solid #b89a63;display:flex;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:#22323a;overflow:hidden}.bar i{display:block;height:100%;background:var(--muted)}
svg{display:block}
/* Narrow viewers and PDF export: scale the 1440px boards instead of clipping them; one board per page when printed. */
@page{size:1440px 900px;margin:0}
@media print{body{zoom:1!important}.frame{margin:0;page-break-after:always;break-after:page}}
</style>
</head>
<body>
<div id="root"></div>
<script>const fit=()=>{document.body.style.zoom=String(Math.min(1,(window.innerWidth-16)/1440));};fit();window.addEventListener('resize',fit);</script>
<script src="art-v22.js"></script>
<script>
const A=window.AOH,{city,citySeal,fort,piece,ship,banner,seal,emblem,hexD,CIV,borderStyle}=A;
const TER={PLAINS:'#71844f',FOREST:'#3f6148',HILLS:'#857c68',MOUNTAINS:'#646d69',SEA:'#264a5c',COAST:'#3f6d7c',UNK:'#1a2327'};
const SEAT={azul:'#6ca7d9',verde:'#5cb3a5',terra:'#d48a6a',violeta:'#a691d6'};
const frames=[];const F=(id,html,cls='')=>frames.push(`<section class="frame ${cls}" id="${id}">${html}</section>`);
const head=(eye,title,lead)=>`<div class="eyebrow">${eye}</div><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}`;
const sv=(w,h,body,vb)=>`<svg width="${w}" height="${h}" viewBox="${vb||`${-w/2} ${-h/2} ${w} ${h}`}">${body}</svg>`;
const hexTile=(r,t='PLAINS')=>`<path d="${hexD(r)}" fill="${TER[t]}" stroke="#0b111455"/>`;
const ERAS=['Fundação','Expansão','Consolidação','Civilização','Impérios','Potências','Ascensão'],RN=['I','II','III','IV','V','VI','VII'];
const DOMC={KNOWLEDGE:'#94bed2',LAND:'#b2cf87',STONE:'#e59a86',GOVERNMENT:'#c4a7d4',TRADE:'#e6c173'};const DOMN={KNOWLEDGE:'Saber',LAND:'Terra e Mar',STONE:'Pedra e Metal',GOVERNMENT:'Governo',TRADE:'Troca'};
const RES=[['Alimento','#b2cf87',15],['Madeira','#c69a68',15],['Pedra','#aeb7b8',15],['Riqueza','#e6c173',15],['Metal','#9fb7c5',10],['Conhecimento','#94bed2',10],['Influência','#c4a7d4',10],['Cultura','#d9a8b8',10]];
function terrainAt(q,r,seed=1){const R=A.rng(seed*7919+q*131+r*977);const n=Math.sin(q*.55+seed)+Math.cos(r*.7-seed*.3)+Math.sin((q+r)*.35)*.8+R()*.5;if(q<3||(r>9&&q<6))return 'SEA';if(q<5)return 'COAST';return n>1.7?'MOUNTAINS':n>1.05?'HILLS':n<-.6?'FOREST':'PLAINS';}
function hexMap(o){const{cols,rows,R}=o;const S=Math.sqrt(3);let g='';const pos=(q,r)=>[o.ox+(q+(r&1)*.5)*S*R,o.oy+r*1.5*R];const tiles=[];
 for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const t=terrainAt(q,r,o.seed||1);const[x,y]=pos(q,r);const hid=o.hidden&&o.hidden(q,r);tiles.push({q,r,t,x,y});g+=`<path d="${hexD(R,x,y)}" fill="${hid?TER.UNK:TER[t]}" stroke="#0b111433"/>${hid?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="${R*.6}" fill="#3a4a50">?</text>`:''}`;}return{g,pos,tiles};}

/* 1 estrutura */
(()=>{let eras='';ERAS.forEach((e,i)=>{eras+=`<div class="glass" style="padding:12px 14px;flex:1;min-width:0;${i===6?'border-color:var(--gold)':''}"><div class="disp" style="font-size:26px;color:var(--gold2)">${RN[i]}</div><div class="disp" style="font-size:15px">${e}</div><div class="dim" style="font-size:12px;margin-top:6px">5 rodadas · patamar ${i+1} da Teia</div><div style="display:flex;gap:4px;margin-top:10px">${[1,2,3,4,5].map(r=>`<span style="flex:1;height:6px;border-radius:3px;background:${i<1?'var(--gold)':i===1&&r<3?'var(--gold)':'#22323a'}"></span>`).join('')}</div>${i===6?'<div class="tag" style="margin-top:10px;color:var(--gold2);border-color:var(--bronze)">Declaração de Hegemonia</div>':''}${i===0?'<div class="dim" style="font-size:12px;margin-top:8px">Pulso obrigatório</div>':''}</div>`;});
 F('p1',head('Regras V5.1b FINAL · 1','7 Eras × 5 rodadas × 5 Ordens','Padrão de 35 rodadas. Cada rodada, cada jogador autoriza 5 ações com Ordens. Hegemonia não é Era: a Era VII só abre a declaração. Sem Hegemonia, vence o maior Prestígio na rodada 35.')+
 `<div style="display:flex;gap:10px;margin-top:18px">${eras}</div>
 <div style="display:flex;gap:28px;margin-top:26px;align-items:flex-start"><div class="glass" style="padding:16px 18px;width:560px"><div class="eyebrow">Uma rodada</div><div style="display:flex;gap:10px;align-items:center;margin-top:10px">${['Cidade','Expedição','Avanço','Influência','Legado'].map((o,i)=>`<span class="order ${i<3?'used':i===3?'plan':''}">${o}</span>`).join('')}<span class="dim" style="margin-left:10px">5 Ordens · tipos podem repetir</span></div><p class="muted" style="margin-top:12px">A Ordem autoriza; não paga. Recursos e pré-requisitos continuam. Ações livres não gastam Ordem: responder propostas, 1 Manobra + 1 Reação, escolha do Pulso, postura defensiva, poder do Líder.</p></div>
 <div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Configuração</div><table class="t" style="margin-top:8px;width:100%"><tr><th>Parâmetro</th><th>Padrão</th><th>Faixa</th></tr><tr><td>Eras</td><td>7</td><td>3–7</td></tr><tr><td>Rodadas por Era</td><td>5</td><td>3–7</td></tr><tr><td>Ordens por rodada</td><td>5</td><td>3–6</td></tr><tr><td>Mapa · população inicial</td><td>Misto · 2</td><td>como hoje</td></tr></table></div></div>
 <div class="note">Curva: I–II exploração e primeira expansão · III especialização · IV civilizações maduras · V impérios · VI potências e Obras · VII corrida real por Hegemonia.</div>`);})();

/* shared mesa pieces */
function strip(o){const seals=[['valgard',SEAT.azul,1,'✓'],['thalos',SEAT.verde,0,'…'],['meridia',SEAT.terra,0,'✓']].map(([c,col,me,st])=>`<span class="seal${me?' me':''}" style="--c:${col}">${sv(22,22,emblem(CIV[c].em,0,0,.75,col,2),'-12 -12 24 24')}<span class="st">${st}</span></span>`).join('');
 return `<div class="glass" style="position:absolute;left:12px;right:12px;top:10px;height:52px;display:flex;align-items:center;gap:14px;padding:0 12px"><span class="disp" style="font-size:15px">Valgard</span><span class="muted">Era <b class="disp gold">${o.era||'II · Expansão'}</b> · Rodada <b class="disp gold">${o.round||'7 / 35'}</b> <span class="dim">(${o.sub||'2ª da Era'})</span></span><span class="tag">${o.phase||'Planejar · 1:12'}</span><span style="display:flex;gap:8px;margin-left:8px">${seals}</span>
 <span class="res-strip" style="display:flex;align-items:center;gap:4px;margin-left:10px;cursor:pointer" title="Ressonância: cinco encaixes; cada avanço registra um; o quinto resolve uma Repercussão. Clique: Tabuleiro da Civilização"><span class="dim" style="font-size:11px">Ressonância</span>${[0,1,2,3,4].map(i=>{const d=(o.resDoms||[])[i];const bg=Array.isArray(d)?`linear-gradient(90deg,${DOMC[d[0]]} 50%,${DOMC[d[1]]} 50%)`:d?DOMC[d]:'transparent';return `<span style="display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;border:1px solid ${i===4&&d?'var(--gold2)':'var(--line)'};background:#0f181c"><span style="display:block;width:8px;height:8px;transform:rotate(45deg);border:1.5px solid ${d?'#0b1114':'#4b5a60'};background:${bg}"></span></span>`;}).join('')}</span>
 <span style="margin-left:auto;display:flex;gap:6px"><span class="btn sm">Cofre</span><span class="btn sm">Livro</span><span class="btn sm" style="color:var(--dim)">Dicas</span></span></div>`;}
function tray(o){const used=o.used||[1,1,1,0,0];const names=o.names||['Cidade','Expedição','Avanço','Influência','Legado'];return `<div class="glass" style="position:absolute;right:12px;bottom:12px;height:72px;border-radius:36px;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px"><span class="dim" style="font-size:12px">Ordens<b class="disp" style="font-size:20px;color:var(--gold2);margin-left:6px">${used.filter(Boolean).length} / 5</b></span><span style="display:flex;gap:6px">${names.map((n,i)=>`<span class="order ${used[i]===1?'used':used[i]===2?'plan':''}" style="width:46px;height:46px;font-size:10px">${n}</span>`).join('')}</span>${o.warn?`<span class="warn" style="font-size:13px">${o.warn}</span>`:''}<span class="btn ${o.primary===false?'':'primary'}" style="border-radius:24px">${o.cta||'Confirmar planejamento ›'}</span></div>`;}

/* 2 HUD */
(()=>{const R=40,M=hexMap({cols:22,rows:14,R,ox:0,oy:30,seed:2});let g=M.g;const at=(q,r,s)=>{const[x,y]=M.pos(q,r);return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${s}</g>`;};
 g+=at(10,5,city(4,R,{col:SEAT.azul,seed:11})+fort(2,R)+`<g transform="translate(28,-20)">${banner('valgard',SEAT.azul,30)}</g>`);g+=at(7,8,city(2,R,{col:SEAT.azul,seed:4}));g+=at(15,8,city(3,R,{col:SEAT.verde,seed:8})+`<g transform="translate(26,-18)">${banner('thalos',SEAT.verde,26)}</g>`);
 g+=at(12,6,piece('infantaria',SEAT.azul,34,{n:3}));g+=at(13,4,piece('explorador',SEAT.azul,34));g+=at(9,7,piece('pioneiro',SEAT.azul,34));g+=at(3,6,`<g transform="rotate(-15)">${ship('batel',SEAT.azul,46)}</g>`);
 const[px,py]=M.pos(10,5);g+=`<g transform="translate(${px},${py-R-16})"><rect x="-26" y="-9" width="52" height="18" rx="9" fill="#e8dbbb" stroke="#0b1114"/><text y="4" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="11" fill="#2a2116">N4 · 2</text></g>`;
 const map=`<svg width="1440" height="900" style="position:absolute;inset:0"><rect width="1440" height="900" fill="#0b1114"/>${g}</svg>`;
 const cardHtml=`<div class="glass" style="position:absolute;right:12px;top:74px;width:360px;padding:14px 16px"><div class="eyebrow">Cidade · N4 Cidade · Capacidade 2</div><h3 class="disp" style="font-size:20px;color:var(--gold2);margin:4px 0">Passo de Valgard</h3><div class="muted" style="font-size:13px">8 habitantes · Ânimo <b class="ok">Próspera</b> (+1 Capacidade na 1ª ativação) · Muralha de Pedra íntegra</div><div style="display:flex;gap:6px;margin:10px 0 6px"><span class="tag">ativações 1 / 2</span><span class="tag prop">2ª ativação: −1 Ânimo</span></div>
 <div style="display:grid;gap:6px;margin-top:8px"><div class="glass" style="padding:10px;border-color:var(--mark)"><b>Produzir</b> <span class="dim">· Ordem Cidade</span><div class="muted" style="font-size:13px">Colhe o centro + 3 hexes trabalhados (Capacidade 2 + Próspera): +4 Alimento, +2 Madeira, +1 Pedra, +1 Conhecimento</div></div><div class="glass" style="padding:10px"><b>Construir</b> <span class="dim">· 1 construção</span><div class="muted" style="font-size:13px">Mercado 2 Madeira 2 Riqueza · Fortaleza 5 Pedra 2 Metal (Era III)</div></div><div class="glass" style="padding:10px"><b>Recrutar</b> <span class="dim">· até 2 peças</span></div><div class="glass" style="padding:10px"><b>Governar</b> <span class="dim">· +1 Ânimo (1 Cultura) · reparo 1 Pedra</span></div></div></div>`;
 const pulse=`<div class="glass" style="position:absolute;left:16px;top:74px;padding:6px 12px;font-size:13px;color:var(--muted)">Pulso da Era II: <b class="gold">Ventos de Travessia</b> · +1 Riqueza para todos</div>`;
 const fan=`<div style="position:absolute;left:30px;bottom:-30px;width:240px;height:110px">${[0,1,2].map(i=>`<div class="card" style="position:absolute;left:${i*34}px;top:${Math.abs(i-1)*5}px;transform:rotate(${(i-1)*7}deg);width:84px;height:118px"><div class="hd" style="height:18px;font-size:9px">${i===2?'Valgard':'Manobra'}</div></div>`).join('')}</div>`;
 F('p2',map+strip({resDoms:['STONE','STONE']})+pulse+cardHtml+fan+tray({used:[1,1,0,0,0],warn:'Passo de Valgard sem ação'}),'mesa');
 F('p2b',`<div style="position:absolute;inset:0;background:#0b1114"></div>`+head('Regras V5.1b FINAL · 2','HUD da rodada: o que fica sempre visível','A Faixa cresce três coisas: a rodada dentro da Era (7 / 35, 2ª da Era), os cinco encaixes de Ressonância e o Livro com ponto quando algo espera. A Bandeja troca "ações 2 / 7" por 5 fichas de Ordem. O resto permanece sob demanda.')+
 `<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px"><div class="glass" style="padding:16px"><div class="eyebrow">Sempre</div><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px"><li>Era e rodada (7 / 35 · 2ª da Era)</li><li>Fase e prazo</li><li>Selos dos lugares com ✓ / …</li><li>Ressonância: cinco encaixes compactos ao lado do selo; clique abre o Tabuleiro da Civilização</li><li>5 fichas de Ordem e um CTA dourado</li><li>Cidade: selo N·Capacidade e cor da praça = Ânimo</li></ul></div><div class="glass" style="padding:16px"><div class="eyebrow">Sob demanda</div><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px"><li>Cofre: 8 recursos atual/limite</li><li>Livro: Conselho · Teia · Cartas · Diplomacia · Eras & Hegemonia · Crônicas</li><li>Cartão da seleção</li><li>Prévias de exploração ao passar sobre uma Região oculta</li><li>Encontros e Pulsos como pergaminho, uma decisão de cada vez</li></ul></div></div>
 <div style="margin-top:22px">${tray({used:[1,1,2,0,0]}).replace('position:absolute;right:12px;bottom:12px;','position:relative;display:inline-flex;')}</div><div class="dim" style="margin-top:8px;font-size:13px">Ficha cheia = Ordem gasta · tracejada dourada = planejada nesta rodada · vazia = disponível. Passar o mouse numa ficha lista o que ela autoriza.</div>`,'');})();

/* 3 bandeja */
(()=>{const row=(n,a,ex)=>`<div class="glass" style="padding:12px 14px;display:flex;gap:14px;align-items:center"><span class="order used" style="flex:none">${n}</span><div style="flex:1"><b>${a}</b><div class="muted" style="font-size:13px">${ex}</div></div></div>`;
 F('p3',head('Regras V5.1b FINAL · 3','Bandeja das 5 Ordens','Cada ação principal planejada ocupa uma ficha. Ao confirmar, as Ordens viram ações na resolução. A Ordem autoriza; a cidade, a peça e os recursos ainda precisam existir.')+
 `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">${row('Cidade','Produzir · Construir · Recrutar · Governar','Ativa uma cidade. Máx. 2 ativações por cidade por rodada; a 2ª custa 1 nível de Ânimo.')}${row('Expedição','mover · explorar · fundar · embarcar · desembarcar · atacar','Uma pilha ou peça. Entrar em cidade inimiga é sempre ataque.')}${row('Avanço','pesquisar','Um avanço da Teia ou de Herança. Custo em Conhecimento (+ recurso temático).')}${row('Influência','tratado · oferta · rota · missão cultural · povo · integração · Governo','Enviado, cidade ou civilização. Adotar ou reformar Governo é Influência. Responder a propostas é livre.')}${row('Legado','Obra de Legado · empreendimento excepcional','Iniciar/avançar uma Obra; empreendimento excepcional; Declaração de Hegemonia (Era VII).')}<div class="glass" style="padding:12px 14px;border-color:var(--bronze)"><div class="eyebrow">Livres (sem Ordem)</div><div class="muted" style="font-size:13px;margin-top:6px">1 Manobra proativa + 1 Reação · escolha do Pulso · postura defensiva · poder do Líder · cancelar antes de confirmar</div></div></div>
 <div style="margin-top:22px;display:flex;gap:30px;align-items:center">${tray({used:[1,1,1,2,0],cta:'Confirmar planejamento ›'}).replace('position:absolute;right:12px;bottom:12px;','position:relative;display:inline-flex;')}<div class="muted" style="max-width:500px;font-size:13.5px">Antes de confirmar, com Ordem sobrando: aviso curto na própria Bandeja ("1 Ordem livre"), nunca um modal. Com Ordem a mais que o permitido, a ficha fica vermelha e a última ação pede escolha.</div></div>`);})();

/* 4 cidade */
(()=>{const r=60;const names=['Posto','Aldeia','Vila','Cidade','Grande Cidade','Metrópole','Imperial'],pop=[2,4,6,8,11,14,18],cap=[1,1,2,2,3,3,4],slots=[1,1,2,3,4,5,6],sup=[2,2,3,3,4,4,5];

 `<div style="display:flex;gap:24px;margin-top:14px;align-items:flex-start"><div class="glass" style="padding:14px 16px;width:900px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Vila de Passo de Valgard · N3 · 8 habitantes</span><span class="dim" style="font-size:12px">Sustento 4 · Crescer 3 · teto 10 · <b class="warn">Planejamento: alocação aberta</b></span></div><div style="display:flex;gap:6px;margin-top:12px;justify-content:space-between">${chips}</div><div style="margin-top:14px;padding-top:12px;border-top:1px solid #22323a"><div class="eyebrow">Elevar para Cidade (N4)</div><div style="display:flex;gap:18px;margin-top:6px;font-size:13.5px"><span class="ok">✓ 8 habitantes</span><span class="ok">✓ 5 Madeira · 3 Pedra · 2 Riqueza</span><span class="bad">✗ Engenharia (Teia · Era III)</span><span class="btn sm" style="margin-left:auto;opacity:.5">Elevar</span></div></div></div>

 chain.forEach(([a,b])=>{const[x1,y1]=nodeAt[a],[x2,y2]=nodeAt[b];g+=`<path d="M${x1+W/2},${y1} C${x1+W/2+40},${y1} ${x2-W/2-40},${y2} ${x2-W/2},${y2}" fill="none" stroke="#33474f" stroke-width="1.5"/>`;});
 const bridge=[['Escrita','Códigos'],['Alvenaria','Urbanismo'],['Matemática','Navegação Oceânica'],['Engenharia','Logística'],['Laboratório','Pólvora'],['Laboratório','Agronomia'],['Filosofia Natural','Saneamento'],['Códigos','Educação Pública']];
 bridge.forEach(([a,b])=>{const[x1,y1]=nodeAt[a],[x2,y2]=nodeAt[b];g+=`<path d="M${x1+W/2},${y1} C${x1+W/2+60},${y1} ${x2-W/2-60},${y2} ${x2-W/2},${y2}" fill="none" stroke="#7d5c33" stroke-width="1.3" stroke-dasharray="4 4"/>`;});
 dom.forEach((d,di)=>{d[2].forEach(([e,n])=>{const[x,y]=nodeAt[n];const col=Math.floor(e),done=col<2||(di===0&&col===2),now=col===2&&di!==0,lock=col>2,ou=n.includes(' OU ');g+=`<g transform="translate(${x},${y})"><rect x="${-W/2}" y="${-H/2}" width="${W}" height="${H}" rx="7" fill="${done?'#1b2a31':'#121b20'}" stroke="${ou?'#e7c98a':done?d[1]:now?'#f4ecd8':'#33474f'}" stroke-width="${now||ou?1.8:1.1}" ${ou?'stroke-dasharray="6 3"':''} opacity="${lock?.6:1}"/><text y="-3" text-anchor="middle" font-size="9.5" font-weight="600" fill="${lock?'#93a3a0':'#eee8da'}">${n.length>21?n.slice(0,20)+'…':n}</text><text y="11" text-anchor="middle" font-size="9" fill="${d[1]}">${RN[col]} · ${col+2} Conh.</text></g>`;});
  g+=`<text x="${X0-170}" y="${Y0+di*DY+4}" font-family="Cinzel" font-weight="600" font-size="12" fill="${d[1]}">${d[0]}</text>`;});

 {const[x,y]=nodeAt['Navegação Oceânica'];const px=X0+4*DX,py=Y0+1*DY;g+=`<path d="M${x+W/2},${y} C${x+W/2+40},${y} ${px-100},${py} ${px-56},${py}" fill="none" stroke="${SEAT.verde}" stroke-width="1.5"/><g transform="translate(${px},${py})"><rect x="-56" y="-16" width="112" height="32" rx="16" fill="#121b20" stroke="${SEAT.verde}" stroke-width="1.4"/><text y="-3" text-anchor="middle" font-size="8.5" fill="${SEAT.verde}">Herança · Thalos · IV · 5 Conh. 1P</text><text y="9" text-anchor="middle" font-size="9.5" font-weight="600" fill="#eee8da">Rede de Faróis</text></g>`;}

 `<div style="display:flex;align-items:center;gap:6px;margin-top:14px">${node('Formações de Guarda','Teia · Pedra e Metal · Era I','2 Conhecimento · pesquisado','done')}${arrow}${node('Passos Guardados','Herança de Valgard · Era II','3 Conhecimento + 1 Pedra · disponível','now')}${arrow}${node('Fortificação','Teia · Pedra e Metal · Era III','4 Conhecimento','lock')}${arrow}${node('Refúgios de Montanha','Herança de Valgard · Era III','5 Conhecimento + 1 Pedra','lock')}${arrow}${node('Defesa Profunda → Muralha Viva','Convergência IV → Herança VI','7 Conhecimento + 2 Metal','lock')}</div>

/* 8 líder */
(()=>{const leader=(n,t,cr,pa,po,af,col)=>`<div class="card" style="width:250px;height:330px"><div class="hd" style="background:#4b3d5c">Líder · Valgard ${sv(16,22,banner('valgard',col,28),'-12 -36 24 38')}</div><div class="art" style="height:70px">${sv(70,70,seal('valgard',col,22),'-30 -30 60 60')}</div><div class="nm">${n}</div><div class="tx" style="color:#6b5a3c;font-style:italic;font-family:'Cormorant Garamond';font-size:14px">${t} · “${cr}”</div><div class="tx"><b>Passiva</b> ${pa}</div><div class="tx"><b>Poder · 1× por Era</b> ${po}</div><div class="ft"><span>Afinidade ${af}</span><span>sem custo</span></div></div>`;
 F('p8',head('Regras V5.1b FINAL · 8','Carta de Líder: escolha 1 de 2 na preparação','Só seis campos: nome, título, crônica curta, passiva, poder 1× por Era, afinidade. O poder volta na passagem de Era. Sem miniatura no mapa neste corte.')+
 `<div style="display:flex;gap:28px;margin-top:18px;align-items:flex-start">${leader('Toren Hjalvar','Senhor das Passagens','Quem guarda o portão guarda o vale.','Peças em território próprio estão sempre supridas.','Muralha Viva: +2 Força nos conflitos desta rodada.','Guerra',SEAT.azul)}${leader('Ysolde Varn','Guardiã dos Refúgios','Um teto para cada inverno.','Governar em cidade fortificada recupera +1 Ânimo.','Portões Abertos: uma cidade em Revolta volta a Abalada.','Sociedade',SEAT.azul)}<div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Na Mesa</div><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px;font-size:13.5px"><li>Na preparação, duas cartas lado a lado; a escolhida vira o selo do jogador na Faixa.</li><li>O poder aparece como botão no Cartão da civilização (Livro · Conselho) e como Manobra livre quando a situação pede.</li><li>Poder usado = selo com meia-lua apagada até a próxima Era.</li><li>Cada civilização terá 2 Líderes originais; as 6 em autoria recebem os seus quando a história for escrita.</li></ul></div></div>`);})();

/* 9 manobra */
(()=>{const m=(fam,n,tx,cost,tag,bg)=>`<div class="card"><div class="hd" style="background:${bg}">${fam}<span style="font-size:9px;opacity:.8">${tag}</span></div><div class="art">${sv(50,50,piece('infantaria','#2a2116',40),'-25 -25 50 50')}</div><div class="nm">${n}</div><div class="tx">${tx}</div><div class="ft"><span>${cost}</span><span>${tag==='Reação'?'Conflitos':'Planejar'}</span></div></div>`;
 F('p9',head('Regras V5.1b FINAL · 9','Manobras: uma família, três tags','Ações, táticas e reações no mesmo baralho, diferenciadas por tag. Mão máxima 5; começa com 3, +1 por Era. Por rodada: 1 proativa + 1 Reação. Efeitos fortes custam recursos. Uma Manobra nunca substitui uma Ordem, salvo texto explícito.')+
 `<div style="display:flex;gap:16px;margin-top:18px">${m('Manobra','Marcha Forçada','Uma pilha +1 movimento nesta rodada.','0','Ação','#2e4a5a')}${m('Manobra','Linha de Escudos','+1 Força nos conflitos desta rodada; +2 se a pilha estiver em território próprio.','1 Metal','Reação','#5a3a3a')}${m('Manobra','Feira Extraordinária','+3 Riqueza. Se houver acordo comercial ativo, +1 Cultura.','1 Influência','Ação','#2e4a5a')}${m('Manobra','Caravana de Emergência','Mova até 3 recursos de uma cidade sitiada para outra ligada por estrada.','2 Riqueza','Tática','#3a4a2e')}${m('Manobra · Valgard','Passagem Guardada','Uma pilha em território próprio +1 Força. Volta à mão a cada Era.','0','Herança','#3c3550')}</div>
 <div class="glass" style="padding:14px 16px;margin-top:22px;width:900px"><div class="eyebrow">Leque na Mesa</div><div class="muted" style="font-size:13.5px;margin-top:6px">Recolhido na borda inferior esquerda; levanta no hover; uma carta em foco por vez com o único botão dourado ("Jogar"). Tag em cor na faixa do topo da carta. Quando o efeito atinge peça ou cidade, o alvo recebe selo no mapa.</div></div>`);})();

/* 10 ambição */
(()=>{const amb=(n,tx,p,prog)=>`<div class="card" style="height:220px"><div class="hd" style="background:#4a3b2a">Ambição<span style="font-size:9px">secreta</span></div><div class="nm" style="margin-top:12px">${n}</div><div class="tx">${tx}</div><div style="padding:0 10px;margin-top:auto"><div class="bar" style="background:#cdbb98"><i style="width:${prog}%;background:#7d5c33"></i></div></div><div class="ft"><span>${p} Prestígio</span><span>${prog}%</span></div></div>`;
 F('p10',head('Regras V5.1b FINAL · 10','Ambições: 3 → 2, no máximo 1 pontuada por Era','Objetivos pessoais secretos de 2 / 3 / 4 Prestígio. Na passagem de Era, uma não concluída pode ser trocada. Cobrem exploração, economia, cidades, cultura, diplomacia, guerra, ciência, naval e Legado.')+
 `<div style="display:flex;gap:16px;margin-top:18px;align-items:flex-start">${amb('Horizonte Ampliado','Revele 6 Regiões.',2,66)}${amb('Rede de Cidades','Tenha 3 cidades N3+ ligadas por estrada.',3,33)}${amb('Costa das Marés','Tenha 2 portos e um navio em cada mar conhecido.',4,25)}<div class="glass" style="padding:16px 18px;flex:1"><div class="eyebrow">Escolha inicial</div><div class="muted" style="font-size:13.5px;margin-top:6px">Três cartas abertas, você guarda duas. A terceira volta ao baralho. Nenhuma ambição exige derrotar um jogador específico.</div><div class="eyebrow" style="margin-top:14px">Famílias</div><div class="muted" style="font-size:13px;margin-top:4px">Exploração · Economia · Cidades · Cultura · Diplomacia · Guerra · Ciência · Naval · Legado — 3 cartas por família, uma em cada dificuldade.</div><div class="eyebrow" style="margin-top:14px">UI</div><div class="muted" style="font-size:13px;margin-top:4px">Livro · Cartas mostra as 2 ativas com barra de progresso; a pontuação acontece na Virada de Era, nunca no meio da rodada.</div></div></div>`);})();

/* 11 ressonância */
(()=>{const marker=(d)=>`<span style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#0f181c;margin:0 4px"><span style="display:block;width:14px;height:14px;transform:rotate(45deg);border:2px solid ${d?DOMC[d]:'#4b5a60'};background:${d?DOMC[d]:'transparent'}"></span></span>`;
 F('p11',head('Regras V5.1b FINAL · 11','Ressonância ◆ ◆ ◆ ◆ ◆ · Repercussão · Pulso do Mundo','Cada civilização tem cinco encaixes: todo avanço (universal, Convergência ou Herança) registra um, na cor do domínio. O quinto resolve uma Repercussão daquela civilização e limpa os cinco. A leitura é visual, sem conta. O Pulso do Mundo é outra coisa: global e obrigatório, uma vez por Era, na Virada.')+
 `<div style="display:flex;gap:28px;margin-top:18px;align-items:flex-start"><div class="glass" style="width:420px;padding:16px 18px"><div class="eyebrow">Ressonância de Valgard</div><div style="margin:10px 0 4px">${marker('STONE')}${marker('STONE')}${marker('TRADE')}${marker('STONE')}${marker(null)}</div><div class="dim" style="font-size:12.5px">4 registrados: Pedra e Metal ×3 (Alvenaria, Metalurgia, Treino de Manobras) e Troca (Moeda). O próximo avanço resolve uma Repercussão de Pedra e Metal.</div><table class="t" style="margin-top:12px;width:100%"><tr><th>Cinco registros</th><th>Repercussão</th></tr><tr><td>3+ de um domínio</td><td>família dominante</td></tr><tr><td>2 + 2 + 1</td><td>híbrida entre os dois domínios</td></tr><tr><td>2 + 1 + 1 + 1</td><td>família do par, tom leve</td></tr><tr><td>cinco diferentes</td><td><b>Confluência</b> (rara, 4%)</td></tr><tr><td>Convergência</td><td>1 encaixe, mostra os dois domínios</td></tr></table><div class="dim" style="font-size:12.5px;margin-top:8px">Ritmo: 1 avanço a cada 2 rodadas → 3–4 Repercussões por civilização em 35 rodadas.</div></div>
 <div class="parch" style="width:460px;padding:16px 18px"><div class="eyebrow">Repercussão · Pedra e Metal, tom Pedra e Metal</div><h3 class="disp" style="font-size:22px;margin:4px 0">Corrida das Forjas</h3><p style="font-size:14px">Suas oficinas atraem olhares. Escolha: <b>+2 Metal agora</b> e um Acampamento Bárbaro surge na fronteira mais próxima da capital, ou <b>nada agora</b> e +1 Prestígio.</p><div style="font-size:12px;color:#6b5a3c;margin-top:10px"><b>Mitigado por</b> Fortificação (o Acampamento nasce com Ameaça I e não cresce na primeira Era) · <b>Aproveitado por</b> Fundição (+1 Metal extra)</div></div>
 <div class="glass" style="padding:14px 16px;flex:1"><div class="eyebrow">Dois eventos, nunca misturados</div><table class="t" style="margin-top:6px;width:100%"><tr><th></th><th>Repercussão</th><th>Pulso do Mundo</th></tr><tr><td>Causa</td><td>3 avanços de uma civilização</td><td>Virada de Era</td></tr><tr><td>Alcance</td><td>aquela civilização</td><td>todas</td></tr><tr><td>Frequência</td><td>3–4 por civ em 35 rodadas</td><td>7 por partida</td></tr><tr><td>Mitigação</td><td colspan="2">Teia, Governo e infraestrutura mitigam, alteram ou aproveitam</td></tr></table></div></div>
 <div class="note">UI: cinco encaixes compactos na Faixa, grandes no Tabuleiro da Civilização (pranchas 19–22); a Repercussão abre como pergaminho na Resolução, com "mitigado por" visível antes da escolha.</div>`);})();

/* 12 encontro */
(()=>{F('p12',head('Regras V5.1b FINAL · 12','Encontro: a descoberta tem duas respostas','Quando a exploração revela algo narrativo (ruína, povo, perigo, passagem, porto natural), um Encontro aparece como pergaminho ao lado da Região, com duas escolhas e consequência imediata.')+
 `<div style="display:flex;gap:28px;margin-top:18px;align-items:flex-start">${sv(360,300,hexTile(150,'HILLS')+`<circle r="40" fill="#5a5247" stroke="#0b1114" stroke-width="2"/><path d="M-22,10 L-10,-22 L10,-22 L22,10 Z" fill="#8a8072" stroke="#0b1114"/><path d="M-30,30 L30,30" stroke="#0b1114" stroke-width="3"/>`+`<g transform="translate(90,-60)">${piece('explorador',SEAT.azul,44)}</g>`)}
 <div class="parch" style="width:520px;padding:16px 18px"><div class="eyebrow">Encontro · Ruína nas Colinas</div><h3 class="disp" style="font-size:22px;margin:4px 0">Salão dos Mestres Esquecidos</h3><p style="font-size:14px">Sob a laje, instrumentos antigos e um mapa de rotas gasto.</p><div style="display:grid;gap:8px;margin-top:12px"><div style="border:1px solid #b89a63;border-radius:6px;padding:8px 10px"><b>Estudar os instrumentos</b><div style="font-size:13px;color:#4a3d2a">+3 Conhecimento. Se tiver Registros de Sinais, +1 Cultura.</div></div><div style="border:1px solid #b89a63;border-radius:6px;padding:8px 10px"><b>Seguir o mapa</b><div style="font-size:13px;color:#4a3d2a">Revela a Região vizinha mais próxima do mar.</div></div></div><div style="font-size:12px;color:#6b5a3c;margin-top:10px">Uma escolha; o Explorador não gasta a Ordem de novo.</div></div>
 <div class="glass" style="padding:14px 16px;flex:1"><div class="eyebrow">Tipos</div><ul class="muted" style="padding-left:18px;margin-top:6px;display:grid;gap:6px;font-size:13.5px"><li>Ruína: recurso civilizacional ou prévia</li><li>Povo independente: primeiro contato e atitude</li><li>Perigo: bando ou tempestade; pode custar uma peça</li><li>Passagem/porto natural: estrada ou ancoradouro grátis</li><li>Extraordinário: +1 Prestígio e Pressão +1</li></ul></div></div>`);})();

/* 13 exploração */
(()=>{const R=40,M=hexMap({cols:22,rows:14,R,ox:0,oy:30,seed:5,hidden:(q,r)=>!(q>=6&&q<=12&&r>=5&&r<=10)});let g=M.g;const at=(q,r,s)=>{const[x,y]=M.pos(q,r);return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${s}</g>`;};
 g+=at(9,6,city(3,R,{col:SEAT.azul,seed:11}));g+=at(12,5,piece('explorador',SEAT.azul,36));
 // region outlines: three candidate regions around explorer
 const regions=[[15,5,'Floresta provável · costa a leste','FOREST'],[14,9,'Colinas · indício de Metal','HILLS'],[9,2,'Desconhecido · sem prévia','UNK']];
 regions.forEach(([q,r,label,t],i)=>{const[x,y]=M.pos(q,r);const pts=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[r&1?1:-1,1],[r&1?1:-1,-1]];let d='';pts.forEach(([dq,dr])=>{const[hx,hy]=M.pos(q+dq,r+dr);d+=hexD(R*.98,hx,hy);});g+=`<path d="${d}" fill="${i===0?'#f4ecd81a':'none'}" stroke="${i===0?'#f4ecd8':'#f4ecd866'}" stroke-width="${i===0?2.5:1.5}" stroke-dasharray="${i===0?'none':'5 4'}"/>`;
  g+=`<g transform="translate(${x},${y-R*2.2})"><rect x="-96" y="-12" width="192" height="24" rx="12" fill="#e8dbbb" stroke="#0b1114"/><text y="4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2a2116">${label}</text></g>`;
  if(t!=='UNK'){g+=`<path d="${hexD(14,x,y)}" fill="${TER[t]}" stroke="#f4ecd8" stroke-width="1.5"/>`;}});
 const map=`<svg width="1440" height="900" style="position:absolute;inset:0"><rect width="1440" height="900" fill="#0b1114"/>${g}</svg>`;
 const card=`<div class="glass" style="position:absolute;right:12px;top:74px;width:360px;padding:14px 16px"><div class="eyebrow">Explorador · Ordem Expedição</div><h3 class="disp" style="font-size:20px;color:var(--gold2);margin:4px 0">Explorar uma Região</h3><p class="muted" style="font-size:13.5px">Escolha qual fronteira investigar. O conteúdo é o da seed; nada gira depois de conhecido. Uma Região pode conter Vestígio, Jazida, Passagem, Ancoradouro, Povo Independente, Perigo ou Acampamento Bárbaro.</p><div class="glass" style="padding:10px 12px;margin-top:10px;border-color:var(--mark)"><b>Região a leste</b><div class="muted" style="font-size:13px">Prévia (Registros de Sinais + Redes de Observatórios): Floresta predominante · costa a leste · sem perigo detectado</div></div><div class="dim" style="font-size:12.5px;margin-top:8px">Sem avanços de prévia, a Região aparece só como “?”.</div><div style="margin-top:12px"><span class="btn primary">Explorar a leste · 1 Ordem</span></div></div>`;
 F('p13',map+strip({resDoms:['KNOWLEDGE']})+card+tray({used:[1,1,2,0,0],primary:false,cta:'Confirmar planejamento ›'}),'mesa');})();

/* 14 virada de era */
(()=>{const step=(n,t,d,st)=>`<div class="glass" style="padding:9px 12px;display:flex;gap:10px;align-items:flex-start;border-color:${st==='now'?'var(--mark)':st==='done'?'#33474f':'#22323a'};opacity:${st==='lock'?.6:1}"><span class="order ${st==='done'?'used':st==='now'?'plan':''}" style="width:30px;height:30px;flex:none;font-size:12px">${n}</span><div><b style="font-size:13px">${t}</b><div class="muted" style="font-size:12px">${d}</div></div></div>`;
 F('p14',head('Regras V5.1b FINAL · 14','Virada de Era: nove passos, um CTA por vez','Depois da rodada 5. A Mesa escurece, o painel ocupa o centro e cada passo pede no máximo uma decisão. Tudo o que é automático aparece já resolvido.')+
 `<div style="display:grid;grid-template-columns:600px 1fr;gap:24px;margin-top:12px"><div style="display:grid;gap:6px">${step('1','Sustento e efeitos pendentes','Manutenção da rodada 5 e efeitos "fim de Era".','done')}${step('2','Ambição','Pontuar no máximo 1 concluída.','done')}${step('3','Pulso do Mundo','Global e obrigatório: Estações Irregulares.','now')}${step('4','Ameaças do Mundo','Acampamentos crescem; bandos e piratas escolhem alvo e movem.','lock')}${step('5','Reforma de Governo','Só aqui, máx. 1 por Era: Conselho → Monarquia (4 Influência, Centralização).','lock')}${step('6','Líder','O poder 1× por Era volta.','lock')}${step('7','Manobras e Ambições','+1 Manobra (até 5); Reações voltam; trocar 1 Ambição.','lock')}${step('8','Teia','Abre o patamar III.','lock')}${step('9','Era III · Consolidação','Todas as civilizações avançam juntas. Rodada 11 / 35.','lock')}</div>
 <div class="glass" style="padding:16px 18px;align-self:start"><div class="eyebrow">Passo 3 · Pulso do Mundo</div><div class="parch" style="margin-top:10px;padding:12px 14px"><div class="eyebrow">Pulso · Era III</div><h3 class="disp" style="font-size:20px;margin:4px 0">Estações Irregulares</h3><p style="font-size:13.5px">Cada cidade sem Celeiro: −2 Alimento; com Celeiro: −1; com Agrário: nada. Um Acampamento surge na fronteira mais remota do mapa.</p><div style="font-size:12px;color:#6b5a3c;margin-top:8px"><b>Mitigado por</b> Irrigação · Celeiro · Agrário</div></div><div style="display:flex;gap:8px;margin-top:14px"><span class="btn primary sm" style="margin-left:auto">Aceitar o Pulso e seguir ›</span></div></div></div>`);})();

/* 15 hegemonia */
(()=>{const path=(n,reqs,col,me)=>`<div class="glass" style="padding:12px 14px;border-color:${me?'var(--gold)':'#33474f'}"><div style="display:flex;justify-content:space-between;align-items:center"><b class="disp" style="font-size:15px">${n}</b>${me?'<span class="tag" style="color:var(--gold2);border-color:var(--bronze)">declarada · 1 / 2 rodadas</span>':''}</div><ul style="list-style:none;margin-top:8px;display:grid;gap:4px;font-size:13px">${reqs.map(([t,ok])=>`<li style="display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:${ok?'var(--ok)':'#33474f'};border:1px solid ${ok?'var(--ok)':'var(--dim)'}"></span><span class="${ok?'':'muted'}">${t}</span></li>`).join('')}</ul></div>`;
 F('p15',head('Regras V5.1b FINAL · 15','Corrida por Hegemonia: Era VII','Seis caminhos, três requisitos objetivos cada. Declarar (Ordem Legado) só com os três cumpridos; sustentar 2 rodadas completas; vitória imediata. Todos veem quem declarou e o que falta aos outros. Sem Hegemonia até a rodada 35: maior Prestígio.')+

function webSvg(done,reach,now,W=860){

  const pos={};WEB.forEach((d,di)=>d[2].forEach(([e,n])=>{const col=Math.floor(e),twin=d[2].some(([f])=>f!==e&&Math.floor(f)===col);pos[n]=[X0+col*DX,Y0+di*DY+(twin?(e%1?11:-11):0)];}));
  WEB.forEach((d,di)=>{g+=`<text x="4" y="${Y0+di*DY+NH/2+3}" font-family="Cinzel" font-weight="600" font-size="8.5" fill="${DOMC[d[0]]}">${d[1]}</text>`;
    d[2].forEach(([e,n],i)=>{const[x,y]=pos[n];const isDone=done.has(n),isReach=reach.has(n),isNow=now===n,ou=n.includes(' OU ');
      if(i>0){const[px,py]=pos[d[2][i-1][1]];if(Math.floor(d[2][i-1][0])!==Math.floor(e))g+=`<line x1="${px+NW}" y1="${py+NH/2}" x2="${x}" y2="${y+NH/2}" stroke="${isDone?DOMC[d[0]]:'#2a3a41'}" stroke-width="1"/>`;}
      g+=`<g transform="translate(${x},${y})"><rect width="${NW}" height="${NH}" rx="5" fill="${isDone?'#1b2a31':isReach?'#e8dbbb':'#101a1e'}" stroke="${isNow?'#f4ecd8':isDone?DOMC[d[0]]:isReach?'#b89a63':'#2f4049'}" stroke-width="${isNow?2:1}" ${ou?'stroke-dasharray="4 2"':''}/>
        <rect x="5" y="${NH/2-6}" width="12" height="12" rx="2" fill="${isDone?DOMC[d[0]]:'none'}" stroke="${isDone?'#0b1114':'#3b4d55'}" stroke-dasharray="${isDone?'none':'2 2'}"/>

  const CY=Y0+5*DY+14;g+=`<text x="4" y="${CY+8}" font-family="Cinzel" font-weight="600" font-size="8.5" fill="#e7c98a">Convergências</text>`;
  const byEra={};CONV.forEach(c=>{(byEra[c[0]]=byEra[c[0]]||[]).push(c);});
  Object.entries(byEra).forEach(([e,list])=>list.forEach((c,i)=>{const x=X0+e*DX+NW/2+(i-(list.length-1)/2)*34,isDone=done.has(c[1]);g+=`<g transform="translate(${x},${CY+4})"><path d="M0,-11 L11,0 L0,11 L-11,0 Z" fill="${isDone?'#1b2a31':'#101a1e'}" stroke="#e7c98a" stroke-width="1"/>${isDone?`<path d="M-5,0 L0,-5 L0,5 Z" fill="${DOMC[c[2][0]]}"/><path d="M5,0 L0,-5 L0,5 Z" fill="${DOMC[c[2][1]]}"/>`:''}<title>${c[1]}</title></g>`;}));
  // heritage links (dashed, civ colour) from the universal node to the panel on the left
  for(const h of HER){const [x,y]=pos[h[2]]||[0,0];g+=`<circle cx="${x+NW}" cy="${y+NH/2}" r="3" fill="${SEAT.azul}"/>`;}
  return `<svg width="${W}" height="${CY+30}" viewBox="0 0 ${W} ${CY+30}">${g}</svg>`;
}

(()=>{const panel=(n,t,body)=>`<div class="glass" style="padding:12px 14px;flex:1;min-height:300px"><div class="eyebrow">${n}</div><h3 class="disp" style="font-size:15px;margin:4px 0 8px">${t}</h3>${body}</div>`;
 const sock=(ds)=>`<div style="display:flex;gap:4px">${[0,1,2,3,4].map(i=>`<span style="display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;border:1px solid ${i===4&&ds[i]?'var(--gold2)':'var(--line)'};background:#0f181c"><span style="display:block;width:12px;height:12px;transform:rotate(45deg);border:1.5px solid ${ds[i]?DOMC[ds[i]]:'#3b4d55'};background:${ds[i]?DOMC[ds[i]]:'transparent'}"></span></span>`).join('')}</div>`;
 F('p22',head('Regras V5.1b FINAL · 22','Fluxo de pesquisa: Reserva → marco na Teia → registro de Ressonância → 5º = Repercussão','A Ordem Avanço é reservada na Bandeja. Na Resolução, um cubo quadrado sai da Reserva de Marcos, anima até o nó da Teia e fica lá para sempre; um losango preenche o próximo encaixe de Ressonância e some no quinto. Mesma cor de domínio, formas diferentes: cubo = adquirido, losango = registro temporário.')+
 `<div style="display:flex;gap:14px;margin-top:14px">${panel('1 · Planejamento','Reservar Fortificação',`<div style="display:flex;align-items:center;gap:8px"><span class="order plan" style="width:46px;height:46px;font-size:10px">Avanço</span><span class="muted" style="font-size:12.5px">4 Conhecimento · Pedra e Metal · Era III. A ficha fica tracejada até a Resolução.</span></div><div style="margin-top:14px">${sock(['TRADE','STONE','KNOWLEDGE','STONE',null])}</div><div class="dim" style="font-size:11.5px;margin-top:6px">Ressonância 4 / 5: a Faixa já avisa que o próximo avanço fecha o ciclo.</div>`)}
 ${panel('2 · Resolução','O marco viaja até a Teia',`<svg width="300" height="120" viewBox="0 0 300 120"><rect x="10" y="80" width="46" height="30" rx="6" fill="#16232a" stroke="#e7c98a" stroke-dasharray="4 3"/><text x="33" y="99" text-anchor="middle" font-size="9" fill="#e7c98a">Avanço</text><path d="M56,95 C120,95 150,30 215,30" fill="none" stroke="#e59a86" stroke-width="2" stroke-dasharray="3 4"/><rect x="200" y="14" width="86" height="30" rx="5" fill="#1b2a31" stroke="#e59a86"/><rect x="206" y="23" width="12" height="12" rx="2" fill="#e59a86" stroke="#0b1114"/><text x="223" y="33" font-size="8" font-weight="600" fill="#eee8da">Fortificação</text><rect x="120" y="58" width="14" height="14" rx="2" fill="#e59a86" stroke="#0b1114" transform="rotate(12 127 65)"/></svg><div class="dim" style="font-size:11.5px">O cubo quadrado sai da Reserva de Marcos, viaja 400 ms e fica no nó para sempre; o nó acende na cor do domínio; Fortaleza, reparo grátis e Herança Refúgios de Montanha ficam disponíveis. Em seguida um losango (não um cubo) preenche o encaixe de Ressonância.</div>`)}
 ${panel('3 · Registro','O quinto encaixe se preenche',`<div style="margin-top:4px">${sock(['TRADE','STONE','KNOWLEDGE','STONE','STONE'])}</div><div class="muted" style="font-size:12.5px;margin-top:10px">Leitura visual: Pedra e Metal ×3, Troca, Saber → <b>família dominante Pedra e Metal</b>. O encaixe dourado pulsa uma vez.</div>`)}
 ${panel('4 · Repercussão','Pergaminho e limpeza',`<div class="parch" style="padding:10px 12px"><div class="eyebrow">Repercussão · Pedra e Metal</div><b class="disp" style="font-size:16px">Corrida das Forjas</b><p style="font-size:12px;margin-top:4px">+2 Metal agora e um Acampamento surge na fronteira mais próxima da capital, ou nada agora e +1 Prestígio.</p><div style="font-size:11px;color:#6b5a3c"><b>Mitigado por</b> Fortificação (Ameaça I, não cresce na primeira Era)</div></div><div style="margin-top:10px">${sock([null,null,null,null,null])}</div><div class="dim" style="font-size:11.5px;margin-top:6px">Os cinco encaixes se esvaziam; o marco de Fortificação continua na Teia.</div>`)}</div>
 <div class="note">Faixa compacta (pranchas 2, 13, 18, 19–21): cinco encaixes de 16 px ao lado dos selos; clique abre o Tabuleiro da Civilização sobre a Mesa, sem scroll global. A Mesa mostra só civilização, Era/rodada, Ressonância, Cofre, Livro e Ordens.</div>`);})();

<tr><td>Ressonância ◆◆◆◆◆</td><td>o que você pesquisa volta para você</td><td>pesquisar agora ou guardar o 5º encaixe</td><td>dois eventos</td><td>cinco encaixes no Tabuleiro da Civilização, compactos na Faixa</td></tr>
<tr><td>Exploração por direção</td><td>escolha espacial sem manipular o mundo</td><td>para onde</td><td>prévias</td><td>Regiões ocultas com prévia no hover; clique revela</td></tr>
