<!-- @dsCard group="Map" height=150 -->
<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div class="row" id="r"></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();const r=document.getElementById('r');[['INFANTRY','Infantaria'],['GUARD','Guarda'],['RANGED','Arqueiros'],['CAVALRY','Cavalaria'],['SIEGE','Cerco'],['EXPLORER','Explorador'],['PIONEER','Pioneiro'],['ENVOY','Enviado'],['FLEET','Frota'],['COASTAL_VESSEL','Embarcação Costeira'],['GUARD','Guarda de Escudos',1]].forEach(([k,n,sig],i)=>r.insertAdjacentHTML('beforeend',`<div><svg width="64" height="64" viewBox="-32 -32 64 64"><path d="${AOH.hexPath(30)}" fill="${css(['FLEET','COASTAL_VESSEL'].includes(k)?'sea':'plains')}"/>${AOH.pieceArt(k,css('civ-'+(1+i%3)),40,i===0?4:0,!!sig)}</svg><div class="lbl">${n}</div></div>`));</script>
