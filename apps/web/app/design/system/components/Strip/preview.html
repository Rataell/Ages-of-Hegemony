<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div style="padding:16px"><div class="aoh-strip aoh-glass" id="s"></div></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();const MARKS={valgard:{emblem:'passo',seal:'HEXAGON',banner:'SHIELD',border:'DASHED'},thalos:{emblem:'farol',seal:'DIAMOND',banner:'PENNANT',border:'DOTTED'},aurelia:{emblem:'espiga',seal:'CIRCLE',banner:'GONFALON',border:'SOLID'},kor:{emblem:'bigorna',seal:'DIAMOND',banner:'SHIELD',border:'SOLID'},meridia:{emblem:'ondas',seal:'CIRCLE',banner:'SWALLOWTAIL',border:'DOTTED'},saren:{emblem:'tresvozes',seal:'HEXAGON',banner:'STRAIGHT',border:'DOUBLE'}};const s=document.getElementById('s');const seal=(m,c,self,st)=>`<span class="aoh-seal${self?' is-self':''}" style="--seat:${c}"><svg width="24" height="24" viewBox="-12 -12 24 24">${AOH.emblemArt(m.emblem,0,0,.75,c,2)}</svg><span class="st">${st}</span></span>`;s.innerHTML=`<span class="aoh-display" style="font-size:15px">Valgard</span><span>Era <b class="aoh-numeral">II · Expansão</b> · Rodada 7 / 15</span><span class="aoh-tag">Planejar · 1:12</span><span style="display:flex;gap:8px;margin-left:12px">${seal(MARKS.valgard,css('civ-1'),1,'✓')}${seal(MARKS.thalos,css('civ-3'),0,'…')}${seal(MARKS.meridia,css('civ-2'),0,'✓')}</span><span style="margin-left:auto;display:flex;gap:8px"><button class="aoh-btn is-sm">Cofre</button><button class="aoh-btn is-sm">Livro</button></span>`;</script>
