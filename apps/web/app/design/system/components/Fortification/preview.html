<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div class="row" id="r"></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();const r=document.getElementById('r');[['PALISADE','INTACT','Paliçada'],['STONE_WALL','INTACT','Muralha de Pedra'],['FORTRESS','INTACT','Fortaleza'],['BASTION','INTACT','Baluarte'],['CITADEL','INTACT','Cidadela'],['FORTRESS','BREACHED','Brecha']].forEach(([l,s,n])=>r.insertAdjacentHTML('beforeend',`<div><svg width="130" height="130" viewBox="-65 -65 130 130"><path d="${AOH.hexPath(62)}" fill="${css('plains')}"/>${AOH.cityArt(4,50,{color:css('civ-1'),seed:9})}${AOH.fortificationArt(l,s,50)}</svg><div class="lbl">${n}</div></div>`));</script>
