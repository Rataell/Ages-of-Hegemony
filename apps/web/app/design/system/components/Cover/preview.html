<style>

  .gold { fill: var(--accent); } .sea { fill: var(--sea); } .parch { fill: var(--parchment); } .seat { fill: var(--civ-1); } .plain { fill: var(--plains); } .steel { fill: var(--surface-elevated); }
  .hex { fill: none; stroke: var(--ink); stroke-width: 3; } .hex.on-dark { stroke: var(--mark); stroke-opacity: .55; }
  .slab { rx: var(--radius-panel); }
  .name { position: absolute; left: 48px; bottom: 64px; margin: 0; max-width: 440px; font: 600 88px/.95 var(--font-display); letter-spacing: .02em; color: var(--text-primary); }
