<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div class="row" id="r"></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();document.getElementById('r').innerHTML=['Fundação','+1 Força','Porto bloqueado'].map((t,i)=>`<svg width="120" height="120" viewBox="-60 -66 120 120"><path d="${AOH.hexPath(52)}" fill="${css(i===2?'coast':'plains')}"/><circle r="47" class="aoh-mark-halo"/><g transform="translate(0 -44)"><rect x="-44" y="-8" width="88" height="16" rx="8" class="aoh-mark-tag"/><text y="4" text-anchor="middle" font-size="10.5" font-weight="700" fill="${css('parchment-ink')}">${t}</text></g></svg>`).join('');</script>
