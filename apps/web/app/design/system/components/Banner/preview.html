<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div class="row" id="r"></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();const MARKS={valgard:{emblem:'passo',seal:'HEXAGON',banner:'SHIELD',border:'DASHED'},thalos:{emblem:'farol',seal:'DIAMOND',banner:'PENNANT',border:'DOTTED'},aurelia:{emblem:'espiga',seal:'CIRCLE',banner:'GONFALON',border:'SOLID'},kor:{emblem:'bigorna',seal:'DIAMOND',banner:'SHIELD',border:'SOLID'},meridia:{emblem:'ondas',seal:'CIRCLE',banner:'SWALLOWTAIL',border:'DOTTED'},saren:{emblem:'tresvozes',seal:'HEXAGON',banner:'STRAIGHT',border:'DOUBLE'}};const r=document.getElementById('r');Object.entries(MARKS).forEach(([id,m],i)=>{r.insertAdjacentHTML('beforeend',`<div><svg width="48" height="64" viewBox="-24 -58 48 64">${AOH.bannerArt(m,css('civ-'+(i+1)),56)}</svg><div class="lbl">${id}</div></div>`);});</script>
