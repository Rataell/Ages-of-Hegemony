<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div class="row" id="r"></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();const r=document.getElementById('r');['SOLID','DASHED','DOTTED','DOUBLE','DASH_DOT','BAND'].forEach((p,i)=>r.insertAdjacentHTML('beforeend',`<div><svg width="130" height="30" viewBox="0 0 130 30"><line x1="8" y1="15" x2="122" y2="15" stroke="${css('ink')}" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>${AOH.borderStrokes(p,css('civ-'+(1+i%3)),3).map(s=>`<line x1="8" y1="15" x2="122" y2="15" ${s}/>`).join('')}</svg><div class="lbl">${p.toLowerCase()}</div></div>`));</script>
