<style>body{margin:0;background:var(--background);color:var(--text-primary);font:14px/1.5 var(--font-body)}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px}.lbl{font-size:12px;color:var(--text-secondary);text-align:center;margin-top:4px}</style><div class="row" id="r"></div><script>const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();const r=document.getElementById('r'),N=['Posto','Aldeia','Vila','Cidade','Grande Cidade','Metrópole','Metrópole Imperial'];for(let l=1;l<=7;l++)r.insertAdjacentHTML('beforeend',`<div><svg width="110" height="120" viewBox="-55 -60 110 120"><path d="${AOH.hexPath(54)}" fill="${css('plains')}"/>${AOH.cityArt(l,50,{color:css('civ-1'),seed:3})}</svg><div class="lbl">${l} · ${N[l-1]}</div></div>`);</script>
